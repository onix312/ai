plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Ключ подписи — локально и вне Git (android/keystore.properties). Его нет в
// репозитории намеренно: чужой APK нельзя ни пересобрать, ни «обновить» чужой
// подписью. Без файла release-сборка выходит неподписанной — скрипт об этом скажет.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
def hasKeystore = keystoreFile.exists()
if (hasKeystore) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'ai.printflow.kassa'
    compileSdk 34

    defaultConfig {
        // Имя пакета — часть контракта: по нему APK ставится поверх себя, а
        // localStorage WebView (код кассы, корзина, отметки «не звенеть»)
        // сохраняется между обновлениями. Менять нельзя без потери настроек.
        applicationId 'ai.printflow.kassa'
        minSdk 24
        targetSdk 34
        versionCode 170013
        versionName '17.0.13'
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                // путь в keystore.properties считаем от android/ — иначе все спотыкаются
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        // Отладочная подпись тоже годится для работы: ставится и
        // переустанавливается без магазина. Но обновление принимает ТОЛЬКО
        // тот же ключ — потому для «боевой» раздачи держат свой keystore
        // (docs/ANDROID.md, раздел «Подпись»), иначе телефон будет
        // отказываться обновлять кассу и потребует удалить старую.
        debug { }
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
