// Единственный модуль: оболочка кассы. Внешних зависимостей нет намеренно —
// WebView, уведомления и вибрация есть в платформе, а каждый чужой AAR это
// ещё и риск «сборка не поднялась через год».
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "PrintFlowKassa"
// Два приложения: касса (app) и пульт цеха (pult). Разные applicationId —
// значит обновление одного не трогает другое, и на телефоне это две иконки.
include ':app'
include ':pult'
