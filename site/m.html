<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<script src="/assets/theme-init.js?v=18.23.1"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrintFlow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>NOZZA · станок</title>
<link rel="stylesheet" href="assets/tokens.css?v=18.23.1">
<link rel="stylesheet" href="assets/nozza-design-v2.css?v=20.1.35">
<style>
 /* 13.1 (Б6): палитра больше не своя — общие токены tokens.css
    (data-theme="dark" на <html>). Ниже только правила самой страницы. */
 * { box-sizing:border-box; margin:0; padding:0; }
 body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
 .wrap { max-width:520px; margin:0 auto; padding:18px 14px 40px; }
 .top { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
 .top img { width:34px; height:34px; }
 .top b { font-size:17px; } .top small { display:block; color:var(--muted); font-size:11px; }
 .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
 .cam { width:100%; border-radius:12px; background:#0a0f1e; aspect-ratio:4/3; object-fit:cover; }
 .state { font-size:13px; font-weight:650; margin-top:8px; }
 .lan { margin-top:8px; font-size:12px; color:var(--muted); word-break:break-all; }
 .lan button { margin-left:8px; padding:4px 8px; border:0; border-radius:7px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
 .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
 .btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
   padding:18px 8px; border-radius:14px; border:1px solid var(--line); background:var(--panel);
   color:var(--text); font-size:13px; font-weight:650; cursor:pointer; }
 .btn .ic { font-size:24px; }
 .btn:active { transform:scale(.97); }
 .btn.primary { background:var(--accent); border-color:transparent; color:#fff; }
 .btn.danger { background:var(--bad); border-color:transparent; color:#fff; }
 .order { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
 .order:last-child { border-bottom:0; }
 .order .t { flex:1; min-width:0; }
 .order b { font-size:13.5px; } .order small { display:block; color:var(--muted); font-size:11px; }
 .order button { padding:9px 12px; border-radius:9px; border:0; background:var(--ok); color:#fff; font-weight:700; cursor:pointer; }
 .low { font-size:12.5px; color:var(--warn); margin-top:6px; }
 .msg { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#fff; color:#12203c;
   padding:10px 16px; border-radius:10px; font-size:13px; font-weight:650; box-shadow:0 8px 30px -10px rgba(0,0,0,.6);
   opacity:0; pointer-events:none; transition:opacity .2s; }
 .msg.on { opacity:1; }
 /* terminal-m.jpg: phone-first workshop controls use the cold terminal palette. */
 html[data-theme] body.pf-utility.pf-machine-page {
   --bg:#0B121B;--bg-2:#101A25;--panel:#16212E;--panel-2:#1C2A39;--panel-3:#243548;
   --line:#2D4052;--line-soft:#243548;--line-strong:#425B72;--text:#F2F6FB;--text-2:#D5E0EB;--muted:#A0B2C5;
   --accent:#818CF8;--accent-2:#6D78E8;--accent-soft:rgba(129,140,248,.16);--accent-line:rgba(155,164,255,.5);
   --ok:#50CBA5;--warn:#F3C66B;--bad:#FB8EA4;color-scheme:dark;color:#F2F6FB;background:#0B121B;
 }
 body.pf-utility.pf-machine-page .card { background:#16212E;border-color:#2D4052;border-radius:14px;box-shadow:none; }
 body.pf-utility.pf-machine-page .btn { min-height:88px;background:#16212E;border-color:#2D4052;border-radius:14px; }
 body.pf-utility.pf-machine-page .btn.primary { background:#818CF8;border-color:#929BFF;color:#fff;box-shadow:none; }
 body.pf-utility.pf-machine-page .btn.danger { background:#FB7185;border-color:#FB7185;color:#fff; }
 body.pf-utility.pf-machine-page .btn:disabled { opacity:.45;cursor:not-allowed; }
 body.pf-utility.pf-machine-page .cam { border:1px solid #2D4052; }
 body.pf-utility.pf-machine-page :focus-visible { outline:2px solid #A5AEFF;outline-offset:2px; }
</style>
</head>
<body class="pf-utility pf-machine-page">
<div class="wrap">
 <div class="top"><img src="assets/brand/nozza-mark-white.svg" alt=""><div><b>NOZZA · станок</b><small>управление с телефона</small></div></div>

 <div class="card">
  <img class="cam" id="cam" alt="Камера">
  <div class="state" id="state">—</div>
  <div class="lan" id="lan"></div>
 </div>

 <div class="card">
  <div class="order" style="padding-top:0"><div class="t"><b>Заказы к выдаче</b><small>готовые и ближайшие</small></div></div>
  <div id="orders"></div>
 </div>

 <div class="card" id="lowBox" hidden>
  <div class="order" style="padding-top:0"><div class="t"><b>Пластик</b><small id="lowHint">ниже порога</small></div></div>
  <div id="lows"></div>
 </div>

 <div class="grid">
  <button class="btn primary" id="b_cam" type="button"><span class="ic">📷</span>Кадр</button>
  <button class="btn" id="b_resume" type="button"><span class="ic">▶</span>Продолжить</button>
  <button class="btn" id="b_convert_order" type="button"><span class="ic">✨</span>В заказ</button>
  <button class="btn" id="b_light" type="button"><span class="ic">☀</span>Свет</button>
  <button class="btn" id="b_next" type="button"><span class="ic">≡</span>Следующее</button>
  <button class="btn" id="b_removed" type="button"><span class="ic">✋</span>Снял деталь</button>
  <button class="btn danger" id="b_pause" type="button"><span class="ic">❙❙</span>Пауза</button>
  <button class="btn" id="b_speed" type="button"><span class="ic">⚡</span>Скорость</button>
  <button class="btn danger" id="b_stop" type="button"><span class="ic">■</span>Стоп</button>
 </div>
</div>
<div class="msg" id="msg"></div>
<script>
(function(){
  'use strict';
  var ops = {};
  function $(s){ return document.querySelector(s); }
  function toast(t){ var m=$('#msg'); m.textContent=t; m.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){m.classList.remove('on');},2400); }
  function get(p){ return fetch(p).then(function(r){return r.json();}); }
  function post(p, body){ return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json();}); }
  function num(v,d){ var n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:(d||0); }
  function pid(){ return (ops.printer && ops.printer.id) || ''; }
  function copy(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast('Скопировано'); }, function(){ toast(text); });
    } else toast(text);
  }

  function renderOps(d){
    ops = d || {};
    var p = ops.printer || {};
    var online = !!p.id;
    document.body.dataset.connection = online ? 'online' : 'unknown';
    document.querySelectorAll('.grid .btn').forEach(function(button){
      if (button.id !== 'b_cam') button.disabled = !online;
    });
    var running = ['RUNNING','PREPARE'].indexOf(p.state) >= 0;
    $('#state').textContent = (p.name || 'Принтер') + ' — ' + (p.state_label || p.state || 'нет связи')
      + (running ? ' · ' + Math.round(num(p.progress)) + '%' : '')
      + (ops.next ? ' · далее ' + ops.next : '');
    if (p.camera && p.id) {
      $('#cam').src = '/api/printer/camera.jpg?printer_id=' + encodeURIComponent(p.id) + '&t=' + Date.now();
    }
    var lan = ops.lan || {};
    var box = $('#lan');
    if (lan.base) {
      box.innerHTML = (lan.reachable === false
        ? 'QR ведёт на localhost — укажите адрес в Настройках. '
        : '') + lan.base + ' <button type="button" id="b_copy">Копировать</button>';
      var c = $('#b_copy');
      if (c) c.onclick = function(){ copy(lan.base); };
    }
    var ready = ops.ready || [];
    $('#orders').innerHTML = ready.length ? ready.map(function(o){
      return '<div class="order"><div class="t"><b>№' + o.number + ' · ' + (o.product || '') + '</b>'
        + '<small>' + (o.due ? 'срок ' + o.due : 'без срока')
        + (o.customer_name ? ' · ' + o.customer_name : '') + '</small></div>'
        + '<button data-fulfill="' + o.id + '">Выдать</button></div>';
    }).join('') : '<div class="order"><div class="t"><small>' + (ops._offline ? 'Нет связи — список заказов недоступен.' : 'Готовых к выдаче нет.') + '</small></div></div>';
    var lows = [];
    (ops.ams_low || []).forEach(function(t){
      lows.push((t.label || 'слот') + ' · ' + Math.round(num(t.remain)) + '%');
    });
    (ops.low_spools || []).forEach(function(s){
      lows.push((s.material || '') + ' ' + (s.color_name || '') + ' · ' + Math.round(num(s.remaining_grams)) + ' г');
    });
    $('#lowBox').hidden = !lows.length;
    $('#lowHint').textContent = lows.length ? 'ниже порога' : 'сейчас всё в норме';
    $('#lows').innerHTML = lows.map(function(x){ return '<div class="low">' + x + '</div>'; }).join('');
  }

  function refresh(){
    fetch('/api/ops/today').then(function(r){ if(!r.ok) throw new Error('offline'); return r.json(); }).then(renderOps).catch(function(){
      fetch('/api/state').then(function(r){ if(!r.ok) throw new Error('offline'); return r.json(); }).then(function(d){
        var p = (d.printers || [])[0] || d.active || {};
        var info = p.printer || {};
        ops = {printer: p.id ? p : (info.id ? info : {}), _offline: !p.id && !info.id};
        document.body.dataset.connection = ops._offline ? 'offline' : 'online';
        document.querySelectorAll('.grid .btn').forEach(function(button){ if(button.id !== 'b_cam') button.disabled = ops._offline; });
        $('#state').textContent = (p.name || 'Принтер') + ' — ' + (info.state_label || info.state || '—');
        if (p.camera && p.camera.available) {
          $('#cam').src = '/api/printer/camera.jpg?printer_id=' + encodeURIComponent(p.id) + '&t=' + Date.now();
        }
      }).catch(function(){
        ops = {_offline:true};
        document.body.dataset.connection = 'offline';
        document.querySelectorAll('.grid .btn').forEach(function(button){ if(button.id !== 'b_cam') button.disabled = true; });
        $('#state').textContent = 'Нет связи с принтером — данные и управление недоступны';
        $('#orders').innerHTML = '<div class="order"><div class="t"><small>Нет связи — список заказов недоступен.</small></div></div>';
        $('#lowBox').hidden = false;
        $('#lowHint').textContent = 'данные недоступны';
        $('#lows').innerHTML = '<div class="low">Остатки пластика недоступны без связи.</div>';
      });
    });
  }

  document.addEventListener('click', function(e){
    var f = e.target.closest('[data-fulfill]');
    if (f) {
      get('/api/order/fulfillment?id=' + encodeURIComponent(f.dataset.fulfill)).then(function(info){
        if (!info.can_fulfill) { toast((info.blocks || []).map(function(x){ return x.text; }).join('; ')); return; }
        var due = num((info.payment || {}).due);
        if (due) {
          toast('Остаток ' + due + ' ₽ — выберите кассу или долг в основной панели.');
          return;
        }
        if (!confirm('Заказ полностью оплачен. Подтвердить физическую передачу клиенту?')) return;
        return post('/api/order/fulfill', {
          id: f.dataset.fulfill, handoff_confirmed: true,
          payment_action: 'none', payment_method: ''
        });
      }).then(function(d){
        if (!d) return;
        if (d.ok) toast('Выдан №' + d.number); else toast(d.error || 'Ошибка');
        refresh();
      }).catch(function(err){ toast(err.message || 'Ошибка'); });
      return;
    }
    if (e.target.id === 'b_cam') { refresh(); return; }
    if (e.target.id === 'b_removed') {
      post('/api/printer/part-removed', { printer_id: pid() }).then(function(d){
        toast('Снято · простой ' + (d.idle_min || 0) + ' мин');
      });
      return;
    }
    if (e.target.id === 'b_pause') {
      if (!confirm('Пауза?')) return;
      post('/api/printer/command', { command: 'pause', printer_id: pid() }).then(function(){ toast('Пауза'); });
      return;
    }
    if (e.target.id === 'b_resume') {
      post('/api/printer/command', { command: 'resume', printer_id: pid() }).then(function(){ toast('Продолжить'); });
      return;
    }
    if (e.target.id === 'b_convert_order' || e.target.closest('#b_convert_order')) {
      post('/api/printer/convert-to-order', { printer_id: pid() }).then(function(d){
        if (d && d.order) {
          toast(d.created ? 'Создан заказ №' + d.order.number : 'Заказ №' + d.order.number);
          refresh();
        } else {
          toast('Не удалось создать заказ');
        }
      }).catch(function(err){ toast(err.message || 'Ошибка'); });
      return;
    }
    if (e.target.id === 'b_light') {
      post('/api/printer/command', { command: 'light', value: true, printer_id: pid() }).then(function(){ toast('Свет'); });
      return;
    }
    if (e.target.id === 'b_next') {
      if (!ops.next_id) { toast(ops.queue ? 'Нет id задания' : 'Очередь пуста'); return; }
      if (!confirm('Запустить следующее: ' + (ops.next || '') + '?')) return;
      post('/api/jobs/start', { id: ops.next_id, printer_id: pid() }).then(function(d){
        toast(d.ok ? 'Запущено' : (d.error || 'Не вышло'));
        refresh();
      });
      return;
    }
    if (e.target.id === 'b_speed') {
      var p = ops.printer || {};
      var lvl = num(p.speed_level, 2);
      var next = lvl >= 4 ? 1 : lvl + 1;
      post('/api/printer/command', { command: 'speed', value: next, printer_id: pid() }).then(function(){
        toast('Скорость: ' + next);
      });
      return;
    }
    if (e.target.id === 'b_stop') {
      if (!confirm('Остановить печать? Деталь придётся печатать заново.')) return;
      post('/api/printer/command', { command: 'stop', printer_id: pid() }).then(function(){
        toast('Стоп'); refresh();
      });
      return;
    }
  });

  refresh();
  setInterval(refresh, 15000);
})();
</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js?v=18.23.1').catch(() => {});
  });
}
</script>
<script src="/assets/theme-toggle.js?v=18.23.1" defer></script>
</body>
</html>
