<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOZZA — подарочные сертификаты и купоны</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="generator.css?v=18.23.1">
<link rel="stylesheet" href="../assets/nozza-design-v2.css?v=18.23.1">
<style>
  .grid { display: flex; flex-wrap: wrap; gap: 5mm; align-content: flex-start; }
  .sheet-title { font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 3mm; }
  .layout-card { position:relative; flex:none; box-sizing:border-box; overflow:hidden; background:#fff; color:#31242e; font-family:Arial,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; page-break-inside:avoid; break-inside:avoid; }
  .layout-block { position:absolute; display:block; box-sizing:border-box; margin:0; white-space:pre-line; line-height:1.25; overflow:hidden; overflow-wrap:anywhere; font-family:Arial,sans-serif; }
  .layout-block.logo { display:flex; align-items:flex-start; }
  .layout-block.logo { display:flex; align-items:flex-start; }
  .layout-block.logo img { display:block; width:100%; height:100%; object-fit:fill; }
  .layout-block.qr { display:grid; place-items:center; border:.2mm solid #D9C8CE; color:#66555F; background:#fff; text-align:center; }
  .layout-block.qr svg { display:block; width:100%; height:100%; }
  .layout-block.qr.unavailable { border-color:transparent; }
  .layout-block[data-block="amount"], .layout-block[data-block="code"] { white-space:nowrap; }
  #printStatus { min-height:1.4em; margin-top:8px; font-size:12px; color:#66555F; }
  #printStatus.error { color:#b42318; font-weight:700; }
  @media print { .layout-card { outline:none !important; } }

  .editor { background: #f4f6fc; border: 1px solid #dde2ef; border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .editor h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
  .editor .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 10px; }
  .editor .row:last-child { margin-bottom: 0; }
  .editor label { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .editor input { font: inherit; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
  .editor input.wide { min-width: 250px; }
  @media screen {
    body.pf-utility { min-height:100vh; background:radial-gradient(900px 550px at 80% 0,rgba(181,43,255,.09),transparent 62%),#1D161F; color:#F8EEE6; color-scheme:dark; }
    body.pf-utility .panel { position:relative; top:auto; background:linear-gradient(145deg,#302832,#211B25); border-color:#5B465C; box-shadow:0 8px 24px -18px rgba(0,0,0,.85); }
    body.pf-utility .panel h1 { color:#F8EEE6; }
    body.pf-utility .editor { border-color:#5B465C; border-radius:12px; background:linear-gradient(145deg,#2C232E,#241B25); }
    body.pf-utility .editor h3 { color:#E2D2D9; }
    body.pf-utility .editor label { color:#BFAFB7; }
    body.pf-utility .editor input:not([type="checkbox"]) { border-color:#59445B; border-radius:8px; background:#241B25; color:#F8EEE6; }
    body.pf-utility .editor input:focus-visible { outline:2px solid #D5AAFF; outline-offset:2px; }
    body.pf-utility .note { border-color:rgba(244,188,128,.35); border-radius:8px; background:rgba(244,188,128,.1); color:#F4BC80; }
    body.pf-utility .note b { color:#F4BC80; }
    body.pf-utility #printStatus { color:#BFAFB7; }
    body.pf-utility #printStatus.error { color:#FF929F; }
    #sheets { overflow-x:auto; }
    .layout-card { background:#fff; color:#31242e; }
  }
  @media screen and (max-width:640px) {
    body.pf-utility .panel { padding:12px; }
    body.pf-utility .panel .panel-row { align-items:flex-start; }
    body.pf-utility .editor { padding:12px; }
    body.pf-utility .editor .row { align-items:stretch; gap:10px; }
    body.pf-utility .editor label { flex-wrap:wrap; }
    body.pf-utility .editor input, body.pf-utility .editor input.wide { box-sizing:border-box; min-width:0!important; max-width:100%; min-height:40px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
</style>
</head><body class="pf-utility">

<div class="panel noprint">
  <div class="panel-row">
    <h1><img data-nz-mark src="../assets/brand/nozza-mark-1.svg" alt="">Сертификаты и купоны</h1>
    <div class="panel-row" data-nz-common="qr"></div>
    <button class="btn primary" type="button" data-nz-print disabled>Печать</button>
  </div>

  <div class="editor">
    <h3>🎟 Сертификат — 2 на листе</h3>
    <div class="row">
      <label>Номинал <input id="c_amount" data-page="c_amount" style="width:90px" inputmode="decimal" placeholder="Номинал"></label>
      <label>Кому <input id="c_to" data-page="c_to" style="width:170px" placeholder="владельцу сертификата"></label>
      <label>От кого <input id="c_from" data-page="c_from" style="width:150px" placeholder="Имя отправителя"></label>
      <label>Серия/№ <input id="c_code" data-page="c_code" style="width:110px" placeholder="Номер сертификата"></label>
      <label>Действует <input id="c_till" data-page="c_till" style="width:130px" placeholder="Срок действия"></label>
    </div>
    <div class="row">
      <label>На что <input id="c_for" data-page="c_for" class="wide" placeholder="Назначение сертификата"></label>
      <label>Условия <input id="c_cond" data-page="c_cond" class="wide" placeholder="Условия использования"></label>
      <label><input type="checkbox" id="c_qr" data-page="c_qr" checked> QR на сайт</label>
    </div>

    <h3 style="margin-top:12px">🏷 Купон — 8 на листе</h3>
    <div class="row">
      <label>Оффер <input id="k_offer" data-page="k_offer" class="wide" placeholder="Скидка / оффер"></label>
      <label>Код <input id="k_code" data-page="k_code" style="width:100px" placeholder="Промокод"></label>
      <label>Срок <input id="k_till" data-page="k_till" style="width:140px" placeholder="Срок действия"></label>
      <label><input type="checkbox" id="k_qr" data-page="k_qr" checked> QR</label>
    </div>
    <div class="row">
      <label>Условия <input id="k_cond" data-page="k_cond" class="wide" style="min-width:420px" placeholder="Условия купона"></label>
      <label>Купонов <input id="k_count" data-page="k_count" type="number" min="1" max="8" style="width:64px" value="8"></label>
    </div>
  </div>
</div>

<div class="note noprint">
  <b>Печать:</b> плотная бумага 200–300 г/м², масштаб 100 %. Сертификат — 2 на листе, купон — до 8 на листе. Номер сертификата укажите перед печатью, чтобы различать экземпляры.
</div>

<div id="sheets"></div>
<div id="printStatus" class="noprint" role="status" aria-live="polite"></div>

<script src="../assets/qr.js?v=18.23.1"></script>
<script>window.QR_FALLBACK=1;if(!window.QR)window.QR={svg:function(){return '<div style="font-size:10px;color:#94a3b8">QR…</div>';}};</script>
<script src="nz.js?v=18.23.1"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);

let printLayouts = null;
const mm = (value) => `${Number(value) || 0}mm`;
const fieldValue = (id, placeholder) => $(id).value.trim() || placeholder;

function renderLayout(id, values, qrState) {
  const spec = printLayouts?.documents?.find((item) => item.id === id);
  if (!spec) return '';
  const blocks = spec.blocks.map((block) => {
    if (block.kind === 'qr' && qrState === 'off') return '';
    const style = [
      `left:${mm(block.x_mm)}`, `top:${mm(block.y_mm)}`,
      `width:${mm(block.width_mm)}`, `height:${mm(block.height_mm)}`,
      `font-size:${Number(block.font_pt) || 9}pt`,
      `font-weight:${/bold/i.test(block.font || '') ? 700 : 400}`,
      `line-height:${Number(block.line_height) || 1.25}`,
      `color:${block.color || '#31242E'}`,
      `background:${block.background || 'transparent'}`,
      `text-align:${block.align || 'left'}`,
      `padding:${mm(block.text_padding_mm)}`,
      `border-radius:${mm(block.radius_mm)}`,
    ].join(';');
    let content = NZ.esc(values[block.id] ?? block.text ?? '');
    let extraClass = '';
    if (block.kind === 'logo') {
      const crop = block.source_crop_px || [335, 253, 910, 326];
      const cropName = crop.map((value) => Math.round(Number(value) || 0)).join('-');
      content = `<img src="../assets/brand/nozza-print-crop-${cropName}.png" alt="NOZZA">`;
    } else if (block.kind === 'qr') {
      extraClass = qrState === 'unavailable' ? ' unavailable' : '';
      content = qrState === 'ready'
        ? NZ.qr(NZ.contact().qrbase.trim(), { ecl: 'M', margin: 1 })
        : qrState === 'unavailable' ? '' : NZ.esc(block.text || 'QR\nместо кода').replace(/\n/g, '<br>');
    }
    return `<div class="layout-block ${block.kind}${extraClass}" data-block="${NZ.esc(block.id)}" style="${style}">${content}</div>`;
  }).join('');
  return `<div class="layout-card" data-layout="${id}" style="width:${mm(spec.width_mm)};height:${mm(spec.height_mm)}">${blocks}</div>`;
}

function draw() {
  if (!printLayouts) return;
  const site = NZ.contact().qrbase.trim();
  const qrEnabled = $('c_qr').checked || $('k_qr').checked;
  let validTarget = false;
  try { validTarget = /^https?:$/.test(new URL(site).protocol); } catch (_) { /* empty or invalid URL */ }
  const qrReady = !qrEnabled || (validTarget && typeof window.QR?.svg === 'function');
  const qrState = !qrEnabled ? 'off' : qrReady ? 'ready' : 'unavailable';
  const certValues = {
    amount: fieldValue('c_amount', '[НОМИНАЛ]') + ' ₽',
    fields: `Кому ${fieldValue('c_to', '[ИМЯ]')}\nОт кого ${fieldValue('c_from', '[ИМЯ]')}\nНа что ${fieldValue('c_for', '[НАЗНАЧЕНИЕ]')}`,
    conditions: `№ ${fieldValue('c_code', '[НОМЕР]')} · ${fieldValue('c_till', '[СРОК]')} · ${fieldValue('c_cond', '[УСЛОВИЯ]')}`,
  };
  const couponValues = {
    offer: fieldValue('k_offer', '[СКИДКА / ОФФЕР]'),
    code: fieldValue('k_code', '[ПРОМОКОД]'),
    conditions: [fieldValue('k_till', ''), fieldValue('k_cond', '')].filter(Boolean).join(' · ') || '[СРОК / УСЛОВИЯ]',
  };
  const copies = Math.min(8, Math.max(1, Number($('k_count').value) || 8));
  const cert = renderLayout('certificate', certValues, $('c_qr').checked ? qrState : 'off');
  const coupon = renderLayout('coupon', couponValues, $('k_qr').checked ? qrState : 'off');
  $('sheets').innerHTML =
    `<div class="sheet"><div class="sheet-title noprint">Сертификаты — 186 × 92 мм</div><div class="grid">${cert}${cert}</div></div>` +
    `<div class="sheet"><div class="sheet-title noprint">Купоны — 92 × 50 мм</div><div class="grid">${Array.from({ length: copies }, () => coupon).join('')}</div></div>`;

  const overflow = [...$('sheets').querySelectorAll('.layout-block:not(.logo):not(.qr)')]
    .filter((block) => block.scrollWidth > block.clientWidth + 1 || block.scrollHeight > block.clientHeight + 1);
  const printButton = document.querySelector('[data-nz-print]');
  printButton.disabled = overflow.length > 0 || !qrReady;
  const status = $('printStatus');
  const message = !qrReady
    ? 'QR включён, но ссылка или генератор недоступны. Настройте ссылку либо отключите QR.'
    : overflow.length ? 'Текст выходит за границы макета. Сократите отмеченные поля перед печатью.' : '';
  status.textContent = message;
  status.classList.toggle('error', !!message);
}

fetch('../assets/print-layouts-v2.json', { cache: 'no-store' })
  .then((response) => { if (!response.ok) throw new Error('layout'); return response.json(); })
  .then((data) => { printLayouts = data; draw(); })
  .catch(() => { $('printStatus').textContent = 'Не удалось загрузить print-layouts-v2.json. Печать недоступна.'; $('printStatus').classList.add('error'); });

NZ.mount(draw);
</script>
</body></html>
