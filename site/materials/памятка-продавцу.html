<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOZZA — памятка продавцу</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; min-height: 100%; font-family: Arial,sans-serif; color: #31242E; }
    body { background: #EEEAF0; padding: 20px 0; }
    .toolbar { position: fixed; z-index: 2; top: 16px; right: 16px; display: flex; gap: 8px; }
    .toolbar button, .toolbar a { border: 0; border-radius: 9px; padding: 11px 18px; background: #6E2BC8;
      color: #fff; font: 600 14px Arial,sans-serif; cursor: pointer; text-decoration: none; }
    .toolbar a { background: #fff; color: #31242E; border: 1px solid #DBD2E0; }
    .page-frame { width: 100%; padding: 0 8px 16px; overflow-x: auto; }
    .sheet { position: relative; flex:none; width: 210mm; height: 297mm; margin: 0 auto 16px;
      overflow: hidden; background: #fff; page-break-after: always; break-after: page; }
    .sheet:last-of-type { page-break-after: auto; break-after: auto; }
    .block { position: absolute; overflow: hidden; overflow-wrap: anywhere;
      white-space: pre-wrap; }
    .block-logo img { display: block; width: 100%; height: 100%;
      object-fit: contain; object-position: left center; }
    .loading, .error { width: min(680px,calc(100% - 32px)); margin: 24px auto;
      padding: 18px; border: 1px solid #DBD2E0; border-radius: 10px; background: #fff; }
    .error { color: #9C3E4B; }
    @media screen { .sheet { box-shadow: 0 6px 30px #31242E20; } }
    @page { size: A4; margin: 0; }
    @media print {
      html, body { width: 210mm; margin: 0; padding: 0; background: #fff;
        -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .toolbar, .loading, .error { display: none !important; }
      .page-frame { width: 210mm; padding: 0; overflow: visible; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="?form=seller">Памятка</a>
    <a href="?form=seller-forms">Бланк заявки</a>
    <button type="button" id="print" disabled>Загрузка макета…</button>
  </div>
  <div id="status" class="loading" role="status" aria-live="polite">Загружаю рецепт памятки…</div>
  <div class="page-frame"><main id="sheet" class="sheet" aria-label="Памятка продавцу NOZZA" hidden></main></div>
  <script>
    'use strict';
    const statusNode = document.getElementById('status');
    const sheet = document.getElementById('sheet');
    const printButton = document.getElementById('print');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[char]);
    const today = new Intl.DateTimeFormat('ru-RU', {
      day:'numeric', month:'long', year:'numeric'
    }).format(new Date());
    const formId = new URLSearchParams(location.search).get('form') === 'seller-forms'
      ? 'seller-forms' : 'seller';
    const memoValues = {
      'document-title': 'Памятка продавцу',
      metadata: `Внутренний документ · обновлено ${today}`,
      'faq-0': 'Что можно заказать?\nПитомцы: адресник, табличка, держатель поводка — спросите имя, телефон, размер и цвет.\nДом: органайзер и крепление — нужны фото, размеры и нагрузка.\nБизнес: QR-стойка, ценник, оснастка — уточните количество, макет, срок и реквизиты.',
      'faq-1': 'Сколько стоит и когда будет готово?\nЦены готовых товаров указаны на полке. Индивидуальный заказ мастер рассчитывает после фото, размеров, количества и нужной даты. Не обещайте цену и срок самостоятельно.',
      'faq-2': 'Сможете повторить сломанную деталь?\nПередайте мастеру фото, размеры и назначение. Опасные детали для газа, электричества, автомобиля и защиты без документации не изготавливаем.',
      acceptance: 'Как принять заказ\n1. Запишите задачу словами клиента.\n2. Возьмите имя и телефон или мессенджер.\n3. Попросите фото, размеры, количество, цвет и желаемую дату.\n4. Скажите: «Мастер проверит задачу и пришлёт расчёт».\n5. Создайте заявку в PrintFlow или передайте данные ответственному.\n\nПерсональные данные не оставляйте на виду и не публикуйте.',
      prohibitions: 'Чего не обещать\nТочную цену, срок, нагрузку или материал без расчёта.\nПищевую, медицинскую или детскую безопасность по умолчанию.\nИзготовление чужого персонажа или логотипа без права.\nНесущие и другие критичные изделия без проверки.\nСкидку или бесплатную разработку без согласования.',
      footer: `Внутренний документ · обновлено ${today}`
    };
    fetch('/assets/print-layouts-v2.json').then((response) => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }).then((spec) => {
      const layout = spec.documents.find((document) => document.id === formId);
      if (!layout || layout.width_mm !== 210 || layout.height_mm !== 297) {
        throw new Error(`Рецепт ${formId} отсутствует или имеет неверный формат`);
      }
      document.title = formId === 'seller-forms'
        ? 'NOZZA — бланки заявки продавца' : 'NOZZA — памятка продавцу';
      const values = formId === 'seller-forms'
        ? { 'document-title': 'Бланки заявки продавца',
            metadata: 'Бланк приёма заявки' }
        : memoValues;
      sheet.innerHTML = layout.blocks.map((block) => {
        const style = `left:${block.x_mm}mm;top:${block.y_mm}mm;width:${block.width_mm}mm;` +
          `height:${block.height_mm}mm;font-family:Arial,sans-serif;font-size:${block.font_pt}pt;` +
          `font-weight:${/bold/i.test(block.font) ? 700 : 400};line-height:${block.line_height};` +
          `color:${block.color};background:${block.background || 'transparent'};` +
          `text-align:${block.align};padding:${block.text_padding_mm || 0}mm;` +
          `border-radius:${block.radius_mm || 0}mm;`;
        if (block.kind === 'logo') {
          const crop = block.source_crop_px.map((value) => Math.round(value)).join('-');
          return `<div class="block block-logo" data-block="${escapeHtml(block.id)}" style="${style}">` +
            `<img src="/assets/brand/nozza-print-crop-${crop}.png" alt="NOZZA"></div>`;
        }
        const value = Object.prototype.hasOwnProperty.call(values, block.id)
          ? values[block.id] : block.text || '';
        return `<div class="block" data-block="${escapeHtml(block.id)}" style="${style}">` +
          `${escapeHtml(value).replace(/\n/g, '<br>')}</div>`;
      }).join('');
      sheet.hidden = false;
      void sheet.offsetHeight;
      const overflowing = [...sheet.querySelectorAll('.block:not(.block-logo)')]
        .filter((block) => block.scrollWidth > block.clientWidth + 1 ||
          block.scrollHeight > block.clientHeight + 1);
      if (overflowing.length) {
        sheet.hidden = true;
        throw new Error(`${overflowing.length} текстовых блока выходят за область макета`);
      }
      statusNode.hidden = true;
      printButton.disabled = false;
      printButton.textContent = 'Печать / PDF';
    }).catch((error) => {
      statusNode.className = 'error';
      statusNode.textContent = `Не удалось загрузить макет памятки: ${error.message}`;
      printButton.textContent = 'Печать недоступна';
    });
    printButton.addEventListener('click', () => {
      if (!printButton.disabled && !sheet.hidden) window.print();
    });
  </script>
</body>
</html>
