<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOZZA — прайс на подставку</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; font-family: Arial,Helvetica,sans-serif; color:#31242e; }
  * { box-sizing:border-box; }
  body { margin:0; background:#eceaf0; font-family:Arial,Helvetica,sans-serif; }
  .toolbar { display:flex; align-items:end; flex-wrap:wrap; gap:10px 16px; padding:12px 16px; background:#fff; border-bottom:1px solid #d9c8ce; }
  .toolbar-title { margin-right:auto; font-size:14px; font-weight:700; }
  .toolbar-title small { display:block; margin-top:3px; color:#66555f; font-size:11px; font-weight:400; }
  .field { display:flex; flex-direction:column; gap:4px; color:#66555f; font-size:11px; }
  .field input { min-height:34px; width:min(240px,100%); padding:6px 9px; border:1px solid #cbbbc7; border-radius:5px; color:#31242e; font:13px Arial,Helvetica,sans-serif; }
  button { min-height:36px; padding:8px 14px; border:1px solid #6e2bc8; border-radius:5px; background:#6e2bc8; color:#fff; font:700 13px Arial,Helvetica,sans-serif; cursor:pointer; }
  button.secondary { background:#fff; color:#31242e; border-color:#cbbbc7; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  :focus-visible { outline:3px solid #9b65d6; outline-offset:2px; }
  .notice { width:min(210mm,calc(100% - 24px)); margin:12px auto; padding:9px 12px; border:1px solid #d8b86a; border-radius:5px; background:#fff9e9; color:#634c16; font-size:12px; }
  .notice[hidden] { display:none; }
  .stage { overflow:auto; padding:16px 12px 32px; }
  .sheet { position:relative; flex:none; width:210mm; height:297mm; margin:0 auto; overflow:hidden; background:#fff; color:#31242e; font-family:Arial,Helvetica,sans-serif; box-shadow:0 4px 24px #14121c33; }
  .block { position:absolute; display:flex; align-items:flex-start; justify-content:flex-start; overflow:hidden; white-space:pre-wrap; overflow-wrap:anywhere; }
  .block.logo img { display:block; width:100%; height:100%; object-fit:contain; object-position:left center; mix-blend-mode:normal; }
  .block.cell { border-style:solid; }
  .block.qr { display:grid; place-items:center; border-style:solid; }
  .block.qr svg { display:block; width:100%; height:100%; }
  .block.qr.missing { padding:3mm; border-style:dashed!important; color:#8a3030!important; text-align:center; }
  .status { min-height:17px; color:#66555f; font-size:11px; }
  @page { size:210mm 297mm; margin:0; }
  @media print {
    html,body { width:210mm; height:297mm; margin:0!important; padding:0!important; background:#fff!important; }
    .toolbar,.notice { display:none!important; }
    .stage { overflow:visible; padding:0; }
    .sheet { width:210mm!important; height:297mm!important; margin:0; box-shadow:none; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  }
  @media(max-width:600px) {
    .toolbar-title { width:100%; }
    .field { flex:1; min-width:130px; }
    .actions { display:flex; width:100%; justify-content:flex-end; gap:8px; }
    .stage { padding-left:12px; padding-right:12px; }
  }
</style>
</head>
<body>
<div class="toolbar" aria-label="Параметры прайса">
  <div class="toolbar-title">Прайс на подставку<small>Формат A4 · размеры и позиции из дизайн-реестра</small></div>
  <label class="field">Город<input id="city" maxlength="80" placeholder="Город из настроек"></label>
  <label class="field">Ссылка для QR<input id="link" type="url" inputmode="url" placeholder="https://…"></label>
  <div class="actions"><button class="secondary" id="reload" type="button">Обновить каталог</button><button id="print" type="button" disabled>Печать</button></div>
  <label class="field" style="flex-direction:row;align-items:center"><input id="qr-checked" type="checkbox" style="min-height:0;width:auto">Проверил ссылку и QR</label>
</div>
<div class="notice" id="notice" role="status">Загружаю каталог…</div>
<main class="stage"><section class="sheet" id="sheet" aria-label="Прайс, A4"></section></main>
<script src="../assets/qr.js?v=18.23.1"></script>
<script>
(function(){
  'use strict';
  var layoutUrl='../assets/print-layouts-v2.json';
  var sheet=document.getElementById('sheet');
  var notice=document.getElementById('notice');
  var printButton=document.getElementById('print');
  var qrChecked=document.getElementById('qr-checked');
  var entries=[];
  var catalogReady=false;
  var qrReady=false;
  var cityReady=false;
  function el(id){return document.getElementById(id);}
  function contact(){try{return JSON.parse(localStorage.getItem('nozza:contact')||'{}');}catch(_){return {};}}
  function safeText(value){return String(value==null?'':value);}
  function validUrl(value){try{var u=new URL(value);return u.protocol==='https:'||u.protocol==='http:';}catch(_){return false;}}
  function updatePrint(){printButton.disabled=!(catalogReady&&qrReady&&cityReady&&qrChecked.checked);}
  function setNotice(text,kind){notice.textContent=text;notice.dataset.kind=kind||'';notice.hidden=!text;}
  function put(block,node){
    node.className='block '+(block.kind==='logo'?'logo ':block.kind==='cell'?'cell ':block.kind==='qr'?'qr ':'')+(block.id||'');
    node.dataset.id=block.id;
    node.style.left=block.x_mm+'mm';node.style.top=block.y_mm+'mm';
    node.style.width=block.width_mm+'mm';node.style.height=block.height_mm+'mm';
    node.style.padding=(block.text_padding_mm||0)+'mm';
    node.style.fontSize=block.font_pt+'pt';node.style.lineHeight=String(block.line_height||1.25);
    node.style.fontWeight=block.font==='ArialBold'?'700':'400';node.style.color=block.color||'#31242e';
    node.style.background=block.background||'transparent';node.style.textAlign=block.align||'left';
    if(block.stroke_color){node.style.borderColor=block.stroke_color;node.style.borderWidth=(block.stroke_width_mm||.2)+'mm';}
    if(block.kind==='logo'){
      var img=document.createElement('img');img.src='../assets/brand/nozza-print-crop-335-253-910-326.png';img.alt='NOZZA';node.appendChild(img);
    }else if(block.kind==='qr'){
      node.textContent='QR\nместо кода';node.style.borderColor=block.stroke_color;node.style.borderWidth=(block.stroke_width_mm||.2)+'mm';
    }else node.textContent=block.text||'';
    sheet.appendChild(node);
  }
  function render(layout){
    entries=layout.blocks;
    sheet.replaceChildren();
    entries.forEach(function(block){put(block,document.createElement('div'));});
    document.querySelectorAll('.block[data-id^="cell-"]').forEach(function(cell){cell.textContent='';});
    updateDynamic();
  }
  function money(value){var n=Number(value);return Number.isFinite(n)?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n)+' ₽':'';}
  function updateDynamic(){
    var cfg=contact();
    var city=el('city').value.trim()||safeText(cfg.city).trim();
    cityReady=!!city;
    var metadata=sheet.querySelector('[data-id="metadata"]');
    if(metadata)metadata.textContent=(city?city+' · ':'')+'Актуальные данные каталога';
    for(var i=0;i<10;i++){
      var item=catalogReady?window.__priceCatalog[i]:null;
      [['0',item&&item.name||''],['1',item&&(item.notes||item.material)||''],['2',item?money(item.price):'']].forEach(function(v){
        var node=sheet.querySelector('[data-id="cell-'+i+'-'+v[0]+'"]');if(node)node.textContent=safeText(v[1]);
      });
    }
    var link=el('link').value.trim()||cfg.site||'';
    var qr=sheet.querySelector('[data-id="qr"]');
    qrReady=validUrl(link)&&!!window.QR&&typeof window.QR.svg==='function';
    if(qrReady){qr.innerHTML=window.QR.svg(link,{ecl:'M',margin:1});qr.classList.remove('missing');qr.setAttribute('aria-label','QR-код ссылки '+link);}
    else{qr.textContent='QR\nДобавьте публичную ссылку';qr.classList.add('missing');qr.removeAttribute('aria-label');}
    updatePrint();
  }
  function loadCatalog(){
    catalogReady=false;window.__priceCatalog=[];updateDynamic();updatePrint();setNotice('Загружаю актуальный каталог…','loading');
    fetch('/api/catalog',{headers:{Accept:'application/json'}}).then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json();}).then(function(data){
      var rows=Array.isArray(data.catalog)?data.catalog:[];
      window.__priceCatalog=rows.filter(function(item){return item&&item.name&&item.archived!==1;}).slice(0,10);
      if(!window.__priceCatalog.length){setNotice('Каталог доступен, но в нём нет активных позиций. Печать прайса отключена.','empty');return;}
      catalogReady=true;setNotice(window.__priceCatalog.length<10?'В каталоге '+window.__priceCatalog.length+' позиций; незаполненные строки оставлены пустыми.':'Загружены актуальные позиции каталога.','ready');updateDynamic();
    }).catch(function(){catalogReady=false;window.__priceCatalog=[];updateDynamic();setNotice('Каталог недоступен. Демо-цены не подставляются; подключите PrintFlow, чтобы загрузить реальные позиции.','error');});
  }
  var savedContact=contact();
  el('city').value=safeText(savedContact.city);
  el('link').value=safeText(savedContact.site);
  fetch(layoutUrl).then(function(r){if(!r.ok)throw new Error('layout');return r.json();}).then(function(data){
    var layout=(data.documents||[]).find(function(d){return d.id==='price-list';});
    if(!layout)throw new Error('missing price-list');render(layout);loadCatalog();
  }).catch(function(){setNotice('Не удалось загрузить дизайн-реестр печатных форм.','error');});
  ['city','link'].forEach(function(id){el(id).addEventListener('input',function(){var cfg=contact();cfg[id==='city'?'city':'site']=el(id).value;try{localStorage.setItem('nozza:contact',JSON.stringify(cfg));}catch(_){}updateDynamic();});});
  qrChecked.addEventListener('change',updatePrint);
  el('reload').addEventListener('click',loadCatalog);
  printButton.addEventListener('click',function(){if(!printButton.disabled)window.print();});
})();
</script>
</body>
</html>
