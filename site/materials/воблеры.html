<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOZZA — воблеры на полку</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<style>
  @page { size: A4 portrait; margin: 8mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #12203c; background: #fff; }
  .panel { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    background: #f3f6fd; border: 1px solid #dbe3f2; border-radius: 10px; padding: 10px 14px; margin-bottom: 6mm; }
  .panel b { font-size: 13px; margin-right: 6px; }
  .panel label { font-size: 12px; color: #5d6b85; display: flex; align-items: center; gap: 6px; }
  .panel input { font: inherit; font-size: 12.5px; padding: 5px 8px; border: 1px solid #d6dcea; border-radius: 7px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5mm; }
  .wobbler {
    border: 2px solid #1f3864; border-radius: 12px; padding: 5mm 5mm 4mm; position: relative;
    display: flex; flex-direction: column; height: 74mm;
    background: radial-gradient(circle at 90% 0%, #e8eefc 0 38%, transparent 38%), #fff;
  }
  .wobbler.promo { border-color: #7c3aed; }
  .hole { width: 8mm; height: 8mm; border: 2px solid #1f3864; border-radius: 50%; align-self: center; margin-bottom: 3mm; }
  .name { font-size: 15pt; font-weight: 900; line-height: 1.05; }
  .price { font-size: 26pt; font-weight: 900; color: #4f46e5; margin: 2mm 0 1mm; }
  .offer { font-size: 9.5pt; color: #42506e; line-height: 1.3; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 4mm; }
  .qr { width: 26mm; height: 26mm; flex: none; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .foot .t { font-size: 8.5pt; color: #5d6b85; line-height: 1.3; }
  .foot .t b { color: #1f3864; }
  .cut { border-top: 1.5px dashed #b9c4da; margin: 3mm 0 0; text-align: center; font-size: 7pt; color: #9aa6bd; padding-top: 1mm; }
  @media print { .panel { display: none; } }
</style></head>
<body>
<div class="panel">
  <b>Воблеры на полку — 6 штук на листе</b>
  <label>Оффер <input id="offer" value="Сделаем под вас за 1 день"></label>
  <label>Ссылка QR <input id="link" value="http://192.168.1.10:8080/order.html"></label>
  <label>Цена 1 <input id="p1" value="450 ₽"></label>
  <label>Цена 2 <input id="p2" value="от 150 ₽"></label>
</div>
<div class="grid" id="grid"></div>
<script src="../assets/qr.js"></script>
<script>
(function(){
  var ITEMS = [
    { name: 'Адресник с именем', offer: 'Имя + телефон + цвет', promo: true },
    { name: 'Органайзер по размерам', offer: 'Точно под ваше место' },
    { name: 'Именная табличка', offer: 'Для питомца или дома' },
    { name: 'QR-стойка для бизнеса', offer: 'Меню и оплата на столе' },
    { name: 'Номерки и ценники', offer: 'Партия для кафе и точек' },
    { name: 'Крепление и держатели', offer: 'Ремонт без ожидания доставки' },
  ];
  function el(id){ return document.getElementById(id); }
  function draw(){
    var offer = el('offer').value || 'Сделаем под вас за 1 день';
    var link = el('link').value || 'http://127.0.0.1:8080/order.html';
    var p1 = el('p1').value, p2 = el('p2').value;
    var qr = '';
    if (window.QR) qr = QR.svg(link, { ecl: 'M', margin: 0 });
    else qr = '<span style="font-size:6pt">QR</span>';
    el('grid').innerHTML = ITEMS.map(function(it, i){
      var price = i === 0 ? p1 : p2;
      return '<div class="wobbler' + (it.promo ? ' promo' : '') + '">'
        + '<div class="hole"></div>'
        + '<div class="name">' + it.name + '</div>'
        + '<div class="price">' + price + '</div>'
        + '<div class="offer">' + it.offer + ' · ' + offer + '</div>'
        + '<div class="foot"><div class="qr">' + qr + '</div>'
        + '<div class="t"><b>NOZZA</b><br>Отсканируйте — заказать или спросить</div></div>'
        + '<div class="cut">вырезать · отверстие — для крючка</div></div>';
    }).join('');
  }
  ['offer','link','p1','p2'].forEach(function(id){ el(id).addEventListener('input', draw); });
  draw();
})();
</script>
</body></html>
