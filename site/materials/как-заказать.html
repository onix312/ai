<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOZZA — карточки «как заказать»</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<style>
  @page { size: A4 portrait; margin: 9mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #12203c; background: #fff; }
  .panel { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    background: #f3f6fd; border: 1px solid #dbe3f2; border-radius: 10px; padding: 10px 14px; margin-bottom: 6mm; }
  .panel b { font-size: 13px; margin-right: 6px; }
  .panel label { font-size: 12px; color: #5d6b85; display: flex; align-items: center; gap: 6px; }
  .panel input { font: inherit; font-size: 12.5px; padding: 5px 8px; border: 1px solid #d6dcea; border-radius: 7px; }
  .preview-scroll { width:100%; min-width:0; max-width:100vw; overflow-x:auto; overscroll-behavior-inline:contain; }
  .grid { width:192mm; margin:0 auto; display:grid; grid-template-columns:93.5mm 93.5mm; gap:5mm; }
  .card { width:93.5mm; height:92mm; position:relative; overflow:hidden; background:#fff; font-family:Arial,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .block { position:absolute; box-sizing:border-box; overflow:hidden; white-space:pre-line; line-height:1.25; }
  .block.logo img { display:block; width:100%; height:100%; object-fit:contain; object-position:left center; }
  @media screen {
    body.pf-print-tool { min-height:100vh; padding:20px; background:#1D161F; color:#F8EEE6; }
    body.pf-print-tool .panel { max-width:1160px; margin:0 auto 24px; padding:16px 20px; border:1px solid #5B465C; border-radius:12px; background:linear-gradient(145deg,#392C3B,#251D27); }
    body.pf-print-tool .panel b { color:#F8EEE6; }
    body.pf-print-tool .panel label { color:#BFAFB7; }
    body.pf-print-tool .panel input { min-height:38px; border:1px solid #5B465C; border-radius:8px; background:#241B25; color:#F8EEE6; }
    body.pf-print-tool .preview-scroll { max-width:1160px; margin:0 auto; padding:0 0 24px; }
    body.pf-print-tool .grid { margin-left:auto; margin-right:auto; }
    body.pf-print-tool :focus-visible { outline:2px solid #D5AAFF; outline-offset:2px; }
  }
  @media screen and (max-width:640px) { .grid { margin:0 12px; } }
  @media print { .panel { display: none; } .preview-scroll { width:auto; max-width:none; overflow:visible; } }
</style></head>
<body class="pf-print-tool">
<div class="panel">
  <b>Карточки «как заказать» — 4 штуки на листе</b>
  <label>Срок ответа <input id="srok" value="1 день"></label>
</div>
<div class="preview-scroll"><div class="grid" id="grid"></div></div>
<script>
(function(){
  var STEPS = [
    { t: 'Сфотографируйте', d: 'Место, образец или эскиз — то, что нужно сделать или повторить.' },
    { t: 'Снимите размеры', d: 'Ширина, высота, глубина, отверстия. Линейка — лучший помощник.' },
    { t: 'Выберите цвет и срок', d: 'Из палитры на витрине. Количество тоже подскажите.' },
    { t: 'Получите расчёт', d: 'Цена, материал и дата — до печати. Потом согласуем макет.' },
  ];
  function el(id){ return document.getElementById(id); }
  var layout=null;
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function draw(){
    if(!layout) return;
    var srok=el('srok').value.trim()||'1 день';
    var examples=['Пример: адресник, табличка','Пример: органайзер, крепление','Пример: PLA — чёрный, белый, оранжевый','Ответ в течение '+srok];
    el('grid').innerHTML=STEPS.map(function(step,i){
      var values={step:String(i+1).padStart(2,'0'),title:step.t,description:step.d+'\n'+examples[i]};
      var blocks=layout.blocks.map(function(b){
        var css='left:'+b.x_mm+'mm;top:'+b.y_mm+'mm;width:'+b.width_mm+'mm;height:'+b.height_mm+'mm;font: '+(b.font_pt||8)+'pt Arial,sans-serif;font-weight:'+(b.font==='ArialBold'?'700':'400')+';line-height:'+(b.line_height||1.25)+';color:'+(b.color||'#31242e')+';background:'+(b.background||'transparent')+';text-align:'+(b.align||'left')+';padding:'+(b.text_padding_mm||0)+'mm;border-radius:'+(b.radius_mm||0)+'mm';
        if(b.kind==='logo') return '<div class="block logo" style="'+css+'"><img src="../assets/brand/nozza-print-crop-'+(b.source_crop_px||[]).join('-')+'.png" alt="NOZZA"></div>';
        return '<div class="block" style="'+css+'">'+esc(values[b.id]||'')+'</div>';
      }).join('');
      return '<div class="card" style="width:'+layout.width_mm+'mm;height:'+layout.height_mm+'mm">'+blocks+'</div>';
    }).join('');
  }
  el('srok').addEventListener('input', draw);
  fetch('../assets/print-layouts-v2.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('layout');return r.json();}).then(function(data){layout=(data.documents||[]).find(function(d){return d.id==='how-order';});if(!layout)throw Error('how-order');draw();}).catch(function(){el('grid').textContent='Не удалось загрузить геометрию из print-layouts-v2.json.';});
})();
</script>
</body></html>
