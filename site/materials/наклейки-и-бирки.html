<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOZZA — наклейки</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="generator.css?v=18.23.1">
<link rel="stylesheet" href="../assets/nozza-design-v2.css?v=18.23.1">
<style>
  .grid { display: flex; flex-wrap: wrap; gap: 4mm; align-content: flex-start; }
  .cut { outline: 1px dashed #c3cbdd; outline-offset: 0; }
  .sheet-title { font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 3mm; }
  .sheet-title em { font-style: normal; text-transform: none; letter-spacing: 0; color: #98a2b8; font-weight: 500; }
  h3.block { font-size: 11px; color: var(--ink-soft); margin: 7mm 0 3mm; letter-spacing: .05em; text-transform: uppercase; }
  .recipe-item { position:relative; flex:none; overflow:hidden; box-sizing:border-box; background:#fff; color:#31242e; font-family:Arial,sans-serif; page-break-inside:avoid; break-inside:avoid; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .recipe-block { position:absolute; box-sizing:border-box; overflow:hidden; white-space:pre-line; }
  .recipe-block.logo img { display:block; width:100%; height:100%; object-fit:contain; object-position:left center; }
  .recipe-block.sticker-logo { display:flex; align-items:center; }
  .recipe-block.sticker-logo img { width:100%; height:100%; object-position:left center; }
  .recipe-block.circle { border-radius:50%; }
  .recipe-item[data-layout="round-30"] .recipe-block.circle,
  .recipe-item[data-layout="round-40"] .recipe-block.circle { background:#F6F0F8; }
  .recipe-block.qr { display:grid; place-items:center; border:.2mm solid #d9c8ce; color:#66555f; text-align:center; }
  .recipe-block.qr svg { display:block; width:100%; height:100%; }
  .light .recipe-block.circle { background:#fff !important; }
  body.mono .recipe-item { filter:grayscale(1); }
  .warn { color:#b42318; font-size:12px; font-weight:700; }

  fieldset.counts { border: 1px dashed var(--line); border-radius: 6px; padding: 4px 8px 8px; }
  fieldset.counts legend { font-size: 11px; color: var(--ink-soft); padding: 0 4px; }
  fieldset.counts label { font-size: 11px; margin-right: 8px; white-space: nowrap; }
  fieldset.counts input[type=number] { width: 52px; }
  @media screen {
    body.pf-utility { background: #1D161F; color: #F8EEE6; }
    body.pf-utility .panel { position: static; }
    body.pf-utility .panel label, body.pf-utility fieldset.counts legend { color: #BFAFB7; }
    body.pf-utility .panel input, body.pf-utility .panel select { background: #241B25; color: #F8EEE6; border-color: #5B465C; }
    body.pf-utility .panel .btn:not(.primary) { background: #2C232E; color: #F8EEE6; border-color: #5B465C; }
    body.pf-utility .note { color: #E2D2D9; background: #2C232E; border-color: #5B465C; }
    body.pf-utility .note b { color: #F4BC80; }
    body.pf-utility fieldset.counts { border-color: #5B465C; }
    body.pf-utility .warn { color: #FF929F; }
  }
</style>
</head><body class="pf-utility">
<div class="panel noprint">
  <div class="panel-row">
    <h1><img id="panelMark" src="../assets/brand/nozza-mark-1.svg" alt="">Наклейки</h1>
    <label>Город <input type="text" id="city" value="" placeholder="Город" style="min-width:110px"></label>
    <label>Telegram <input type="text" id="tg" value="" placeholder="@username" style="min-width:110px"></label>
    <label>Подпись на наклейках <input type="text" id="sub" value="" placeholder="Telegram · город (по умолчанию)" style="min-width:190px" title="Свой текст вместо стандартного: акция, «новинка», что угодно"></label>
    <label>Ссылка для QR <input type="text" id="qrlink" value="" title="Куда ведёт QR. Оставьте пустым, пока адрес не подтверждён." style="min-width:160px"></label>
    <button class="btn primary" id="print" disabled>Печать</button>
    <span class="warn" id="printWarn" role="status" aria-live="polite" hidden></span>
  </div>
  <div class="panel-row">
    <fieldset class="counts"><legend>Тираж (штук на листе)</legend>
      <label>Ø40 цветные <input type="number" id="n40c" value="12" min="0" max="99"></label>
      <label>Ø40 светлые <input type="number" id="n40l" value="8" min="0" max="99"></label>
      <label>Ø30 пломбы <input type="number" id="n30" value="20" min="0" max="99"></label>
      <label>50 × 25 <input type="number" id="n50" value="12" min="0" max="99"></label>
    </fieldset>
    <label><input type="checkbox" id="mono"> Чёрно-белая печать (дешевле в копицентре)</label>
    <label><input type="checkbox" id="qrrect" checked> QR на прямоугольных 50 × 25</label>
    <label>Шаблон 50 × 25 <select id="rectTemplate"><option value="brand-rect">Бренд · QR</option><option value="sticker-guarantee">Гарантия цеха</option><option value="sticker-pla">PLA</option><option value="sticker-workshop">Цех NOZZA</option><option value="sticker-fragile">Хрупкое</option><option value="sticker-thanks">Спасибо за заказ</option><option value="sticker-nozza">Сделано в NOZZA</option></select></label>
  </div>
</div>
<div class="note noprint"><b>Материал:</b> круглые и прямоугольные наклейки — на самоклеящейся плёнке или матовой бумаге A4. Печатаете в копицентре: в диалоге печати выберите «Сохранить как PDF» и отдайте файл. Поля и тираж сохраняются после ручного изменения.</div>
<div id="sheets"></div>
<script src="../assets/qr.js?v=18.23.1"></script>
<script>window.QR_FALLBACK=1;if(!window.QR)window.QR={svg:function(){return '<div style="font-size:10px;color:#94a3b8">QR…</div>';}};</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS_CONTACT='nozza:contact';
const PKEY='nozza:page:'+location.pathname;
function loadContact(){ try{return JSON.parse(localStorage.getItem(LS_CONTACT)||'{}')}catch(e){return{}} }
function saveContact(p){ const c=loadContact(); localStorage.setItem(LS_CONTACT, JSON.stringify({...c,...p})); }
function loadPage(){ try{return JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){return{}} }
function savePage(p){ const c=loadPage(); localStorage.setItem(PKEY, JSON.stringify({...c,...p})); }
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
function tgOf(tg){ tg=(tg||'').trim(); if(!tg) return ''; if(/^https?:\/\//.test(tg)) return tg; return 'https://t.me/'+tg.replace(/^@/,''); }
function qrSvg(link){ if(!link) return ''; return QR.svg(link,{ecl:'M',margin:1}); }
function num(id){ const v=parseInt($(id).value,10); return (isFinite(v)&&v>=0)?Math.min(v,99):0; }

let printLayoutsV2=null;
const mm=value=>`${Number(value)||0}mm`;
function recipe(id, values={}, className=''){
  const spec=printLayoutsV2?.documents?.find(x=>x.id===id);
  if(!spec) return '';
  const blocks=spec.blocks.map(b=>{
    const styles=`left:${mm(b.x_mm)};top:${mm(b.y_mm)};width:${mm(b.width_mm)};height:${mm(b.height_mm)};font-family:Arial,sans-serif;font-size:${Number(b.font_pt)||8}pt;font-weight:${/bold/i.test(b.font||'')?700:400};line-height:${Number(b.line_height)||1.25};color:${b.color||'#31242e'};background:${b.background||'transparent'};text-align:${b.align||'left'};padding:${mm(b.text_padding_mm)};border-radius:${mm(b.radius_mm)};${b.stroke_color?`border:${mm(b.stroke_width_mm||.2)} solid ${b.stroke_color};`:''}`;
    if(b.kind==='logo') {
      const sourceCrop=b.source_crop_px||[335,253,910,326];
      const cropSrc=`../assets/brand/nozza-print-crop-${sourceCrop.join('-')}.png`;
      if(id==='round-40'||id==='round-30') return `<div class="recipe-block logo sticker-logo" style="${styles}"><img src="${cropSrc}" alt="NOZZA"></div>`;
      return `<div class="recipe-block logo" style="${styles}"><img src="${cropSrc}" alt="NOZZA"></div>`;
    }
    if(b.kind==='qr') return `<div class="recipe-block qr" style="${styles}">${values.qr?qrSvg(values.qr):esc(b.text||'QR\nместо кода')}</div>`;
    if(b.kind==='circle') return `<div class="recipe-block circle" style="${styles}border-radius:50%;"></div>`;
    if(b.kind==='shape') return `<div class="recipe-block" style="${styles}"></div>`;
    return `<div class="recipe-block" style="${styles}">${esc(values[b.id]!=null?values[b.id]:b.text||'')}</div>`;
  }).join('');
  return `<div class="recipe-item ${className}" data-layout="${id}" style="width:${mm(spec.width_mm)};height:${mm(spec.height_mm)}">${blocks}</div>`;
}

function render(){
  if(!printLayoutsV2) return;
  const city=$('city').value.trim();
  const tg=$('tg').value.trim();
  const subRaw=$('sub').value.trim();
  const link=$('qrlink').value.trim();
  const mono=$('mono').checked;
  const rectId=$('rectTemplate').value;
  const useQr=rectId==='brand-rect'&&$('qrrect').checked;
  const qrReady=typeof QR?.svg==='function'&&!!QR.svg('https://nozza.invalid/qr-probe',{ecl:'M',margin:1});
  const n40c=num('n40c'), n40l=num('n40l'), n30=num('n30'), n50=num('n50');
  const signature=subRaw||[tg,city].filter(Boolean).join(' · ');

  document.body.classList.toggle('mono', mono);
  const roundDark=Array.from({length:n40c},()=>recipe('round-40',{slogan:signature||undefined})).join('');
  const roundLight=Array.from({length:n40l},()=>recipe('round-40',{slogan:signature||undefined,round:'',word:'',slogan:'3D-печать'},'light')).join('');
  const roundSmall=Array.from({length:n30},()=>recipe('round-30',{slogan:'3D-печать'})).join('');
  const rectValues=rectId==='brand-rect'?{sub:signature||undefined,qr:useQr&&link&&qrReady?link:''}:{};
  const rects=Array.from({length:n50},()=>recipe(rectId,rectValues)).join('');
  $('sub').disabled=rectId!=='brand-rect';
  $('qrrect').disabled=rectId!=='brand-rect';

  const networks=[];
  if(n40c) networks.push(`<div class="sheet"><div class="sheet-title">Круглые Ø40 мм — цветные <em>${n40c} шт.</em></div><div class="grid">${roundDark}</div></div>`);
  if(n40l) networks.push(`<div class="sheet"><div class="sheet-title">Круглые Ø40 мм — светлые (для тёмной упаковки) <em>${n40l} шт.</em></div><div class="grid">${roundLight}</div></div>`);
  if(n30) networks.push(`<div class="sheet"><div class="sheet-title">Круглые Ø30 мм — пломба на пакет <em>${n30} шт.</em></div><div class="grid">${roundSmall}</div></div>`);
  if(n50) networks.push(`<div class="sheet"><div class="sheet-title">${esc(printLayoutsV2.documents.find(d=>d.id===rectId)?.title||'Наклейка')} · 50 × 25 мм <em>${n50} шт.${useQr&&link?' · QR':''}</em></div><div class="grid">${rects}</div></div>`);
  $('sheets').innerHTML=networks.join('')||'<div class="note noprint">Тираж везде ноль — поставьте количество копий выше.</div>';
  const overflow=[...$('sheets').querySelectorAll('.recipe-block:not(.logo):not(.qr):not(.circle)')].some(e=>e.scrollWidth>e.clientWidth+1||e.scrollHeight>e.clientHeight+1);
  const missingQr=!!(n50&&rectId==='brand-rect'&&$('qrrect').checked&&(!link||!qrReady));
  const noLabels=!(n40c||n40l||n30||n50);
  $('printWarn').hidden=!overflow&&!missingQr&&!noLabels;
  $('printWarn').textContent=overflow?'Сократите подпись: текст выходит за физический блок.':missingQr?(!qrReady?'Генератор QR не загрузился. Обновите страницу или отключите QR.':'Укажите проверенную ссылку QR или отключите QR на прямоугольных.'):noLabels?'Укажите тираж хотя бы для одного формата.':'';
  $('print').disabled=overflow||missingQr||noLabels;
}

function init(){
  const c=loadContact(), p=loadPage();
  $('city').value=c.city&&c.city!=='Симферополь'?c.city:'';
  const tg=c.tg&&c.tg!=='@nozza_shop'?c.tg:'';
  $('tg').value=tg;
  if(p.sub!=null) $('sub').value=p.sub;
  const savedLink=p.qrlink||'';
  $('qrlink').value=(p.qrcustom&&savedLink)||(savedLink&&savedLink!=='https://t.me/nozza_shop')||(tg?tgOf(tg):'');
  if(p.mono!=null) $('mono').checked=!!p.mono;
  if(p.qrrect!=null) $('qrrect').checked=!!p.qrrect;
  ['n40c','n40l','n30','n50'].forEach(id=>{ if(p[id]!=null) $(id).value=p[id]; });
}

$('city').addEventListener('input', render);
$('city').addEventListener('input', ()=>saveContact({city:$('city').value}));
$('tg').addEventListener('input', ()=>{
  saveContact({tg:$('tg').value});
  if(!loadPage().qrcustom){ $('qrlink').value=tgOf($('tg').value); savePage({qrlink:$('qrlink').value}); }
  render();
});
$('qrlink').addEventListener('input', ()=>{ savePage({qrlink:$('qrlink').value, qrcustom:1}); render(); });
$('sub').addEventListener('input', ()=>{ savePage({sub:$('sub').value}); render(); });
$('mono').addEventListener('change', ()=>{ savePage({mono:$('mono').checked}); render(); });
$('qrrect').addEventListener('change', ()=>{ savePage({qrrect:$('qrrect').checked}); render(); });
$('rectTemplate').addEventListener('change', ()=>{ savePage({rectTemplate:$('rectTemplate').value}); render(); });
['n40c','n40l','n30','n50'].forEach(id=>{ const el=$(id); el.addEventListener('input', ()=>{ savePage({[id]:el.value}); render(); }); });
$('print').addEventListener('click', ()=>{if(!$('print').disabled)window.print();});

init();
if(loadPage().rectTemplate) $('rectTemplate').value=loadPage().rectTemplate;
fetch('../assets/print-layouts-v2.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('layout');return r.json();}).then(data=>{printLayoutsV2=data;render();}).catch(()=>{$('print').disabled=true;$('printWarn').hidden=false;$('printWarn').textContent='Не удалось загрузить геометрию print-layouts-v2.json.';});
</script>
</body></html>
