<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOZZA — наклейки</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="generator.css">
<style>
  .grid { display: flex; flex-wrap: wrap; gap: 4mm; align-content: flex-start; }
  .cut { outline: 1px dashed #c3cbdd; outline-offset: 0; }
  .sheet-title { font-size: 11px; font-weight: 700; color: var(--ink-soft); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 3mm; }
  .sheet-title em { font-style: normal; text-transform: none; letter-spacing: 0; color: #98a2b8; font-weight: 500; }
  h3.block { font-size: 11px; color: var(--ink-soft); margin: 7mm 0 3mm; letter-spacing: .05em; text-transform: uppercase; }

  .round { width: 40mm; height: 40mm; border-radius: 50%; background: linear-gradient(140deg, var(--brand), var(--brand-2)); color: #fff; padding: 4mm; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; page-break-inside: avoid; break-inside: avoid; }
  .round img { width: 12mm; height: 12mm; flex: none; }
  .round .word { font-size: 13px; font-weight: 800; letter-spacing: .12em; margin-top: 1.5mm; }
  .round .sub { font-size: 6.5px; letter-spacing: .06em; opacity: .85; margin-top: .8mm; line-height: 1.3; }
  .round.light { background: #fff; color: var(--ink); border: 1.2px solid var(--line); }
    .round.light .word { color: var(--brand); }
  .round.light .sub { color: var(--ink-soft); opacity: 1; }
  .round.small { width: 30mm; height: 30mm; padding: 3mm; }
  .round.small img { width: 9mm; height: 9mm; }
  .round.small .word { font-size: 10px; }
  .round.small .sub { font-size: 5.5px; }

  .rect { width: 50mm; height: 25mm; border-radius: 2mm; border: 1px solid var(--line); padding: 3mm 3mm 3mm 4mm; display: flex; align-items: center; gap: 2.5mm; position: relative; overflow: hidden; page-break-inside: avoid; break-inside: avoid; }
  .rect::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.4mm; background: linear-gradient(180deg, var(--brand), var(--brand-2)); }
  .rect img { width: 9mm; height: 9mm; flex: none; }
  .rect .rtxt { flex: 1; min-width: 0; }
  .rect .word { font-size: 11px; font-weight: 800; letter-spacing: .1em; }
  .rect .sub { font-size: 6.5px; color: var(--ink-soft); line-height: 1.35; margin-top: .5mm; }
  .rect .rqr { flex: none; }
  .rect .rqr svg { width: 14mm; height: 14mm; display: block; }

  /* ч/б-режим для копицентра: фирменные цвета сводятся к чёрному */
  body.mono .round { background: #141414; color: #fff; }
  body.mono .round.light { background: #fff; color: #111; border-color: #141414; }
  body.mono .round.light .word { color: #141414; }
  body.mono .round.light .sub { color: #444; }
  body.mono .rect::before { background: #141414; }
  body.mono .rect .word { color: #141414; }
  body.mono .rect { border-color: #141414; }

  fieldset.counts { border: 1px dashed var(--line); border-radius: 6px; padding: 4px 8px 8px; }
  fieldset.counts legend { font-size: 11px; color: var(--ink-soft); padding: 0 4px; }
  fieldset.counts label { font-size: 11px; margin-right: 8px; white-space: nowrap; }
  fieldset.counts input[type=number] { width: 52px; }
</style>
</head><body>
<div class="panel noprint">
  <div class="panel-row">
    <h1><img id="panelMark" src="../assets/brand/nozza-mark-1.svg" alt="">Наклейки</h1>
    <label>Город <input type="text" id="city" value="Симферополь" style="min-width:110px"></label>
    <label>Telegram <input type="text" id="tg" value="@nozza_shop" style="min-width:110px"></label>
    <label>Подпись на наклейках <input type="text" id="sub" value="" placeholder="Telegram · город (по умолчанию)" style="min-width:190px" title="Свой текст вместо стандартного: акция, «новинка», что угодно"></label>
    <label>Ссылка для QR <input type="text" id="qrlink" value="" title="Куда ведёт QR на прямоугольных. По умолчанию — ваш Telegram; можно любую ссылку." style="min-width:160px"></label>
    <button class="btn primary" id="print">Печать</button>
  </div>
  <div class="panel-row">
    <fieldset class="counts"><legend>Тираж (штук на листе)</legend>
      <label>Ø40 цветные <input type="number" id="n40c" value="12" min="0" max="99"></label>
      <label>Ø40 светлые <input type="number" id="n40l" value="8" min="0" max="99"></label>
      <label>Ø30 пломбы <input type="number" id="n30" value="20" min="0" max="99"></label>
      <label>50 × 25 <input type="number" id="n50" value="12" min="0" max="99"></label>
    </fieldset>
    <label><input type="checkbox" id="mono"> Чёрно-белая печать (дешевле в копицентре)</label>
    <label><input type="checkbox" id="qrrect" checked> QR на прямоугольных 50 × 25</label>
  </div>
</div>
<div class="note noprint"><b>Материал:</b> круглые и прямоугольные наклейки — на самоклеящейся плёнке или матовой бумаге A4. Печатаете в копицентре: в диалоге печати выберите «Сохранить как PDF» и отдайте файл. Город, подпись и тираж сохраняются автоматически.</div>
<div id="sheets"></div>
<script src="../assets/qr.js"></script>
<script>window.QR_FALLBACK=1;if(!window.QR)window.QR={svg:function(){return '<div style="font-size:10px;color:#94a3b8">QR…</div>';}};</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LS_CONTACT='nozza:contact';
const PKEY='nozza:page:'+location.pathname;
function loadContact(){ try{return JSON.parse(localStorage.getItem(LS_CONTACT)||'{}')}catch(e){return{}} }
function saveContact(p){ const c=loadContact(); localStorage.setItem(LS_CONTACT, JSON.stringify({...c,...p})); }
function loadPage(){ try{return JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){return{}} }
function savePage(p){ const c=loadPage(); localStorage.setItem(PKEY, JSON.stringify({...c,...p})); }
// Вариант знака выбран (1 — «слои»); выбор вариантов удалён в 18.4.1.
const MARK='../assets/brand/nozza-mark-1.svg';
const MARK_WHITE='../assets/brand/nozza-mark-1-white.svg';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
function tgOf(tg){ tg=(tg||'').trim(); if(!tg) return ''; if(/^https?:\/\//.test(tg)) return tg; return 'https://t.me/'+tg.replace(/^@/,''); }
function qrSvg(link){ if(!link) return ''; return QR.svg(link,{ecl:'M',margin:1}); }
function num(id){ const v=parseInt($(id).value,10); return (isFinite(v)&&v>=0)?Math.min(v,99):0; }

function roundSticker(cls, sub, mark){
  return `<div class="round ${cls} cut"><img src="${mark}" alt=""><div class="word">NOZZA</div><div class="sub">${esc(sub)}</div></div>`;
}
function rectSticker(sub, link){
  const qr=link?`<span class="rqr">${qrSvg(link)}</span>`:'';
  return `<div class="rect cut"><img src="${MARK}" alt=""><div class="rtxt"><div class="word">NOZZA</div><div class="sub">${esc(sub)}</div></div>${qr}</div>`;
}

function render(){
  const city=$('city').value.trim()||'Симферополь';
  const tg=$('tg').value.trim();
  const subRaw=$('sub').value.trim();
  const link=$('qrlink').value.trim();
  const mono=$('mono').checked;
  const links=$('qrrect').checked?link:'';
  const n40c=num('n40c'), n40l=num('n40l'), n30=num('n30'), n50=num('n50');
  saveContact({city, tg});

  document.body.classList.toggle('mono', mono);
  const sub=subRaw||`${tg} · ${city}`;

  const roundDark=Array.from({length:n40c},()=>roundSticker('', sub, MARK_WHITE)).join('');
  const roundLight=Array.from({length:n40l},()=>roundSticker('light', sub, MARK)).join('');
  const roundSmall=Array.from({length:n30},()=>roundSticker('small', city, MARK_WHITE)).join('');
  const rects=Array.from({length:n50},()=>rectSticker(sub, links)).join('');

  const networks=[];
  if(n40c) networks.push(`<div class="sheet"><div class="sheet-title">Круглые Ø40 мм — цветные <em>${n40c} шт.</em></div><div class="grid">${roundDark}</div></div>`);
  if(n40l) networks.push(`<div class="sheet"><div class="sheet-title">Круглые Ø40 мм — светлые (для тёмной упаковки) <em>${n40l} шт.</em></div><div class="grid">${roundLight}</div></div>`);
  if(n30) networks.push(`<div class="sheet"><div class="sheet-title">Круглые Ø30 мм — пломба на пакет <em>${n30} шт.</em></div><div class="grid">${roundSmall}</div></div>`);
  if(n50) networks.push(`<div class="sheet"><div class="sheet-title">Прямоугольные 50 × 25 мм <em>${n50} шт.${links?' · QR→Telegram':''}</em></div><div class="grid">${rects}</div></div>`);
  $('sheets').innerHTML=networks.join('')||'<div class="note noprint">Тираж везде ноль — поставьте количество копий выше.</div>';
}

function init(){
  const c=loadContact(), p=loadPage();
  $('city').value=c.city||'Симферополь';
  const tg=c.tg||'@nozza_shop';
  $('tg').value=tg;
  if(p.sub!=null) $('sub').value=p.sub;
  $('qrlink').value=(p.qrlink!=null)?p.qrlink:tgOf(tg);
  if(p.mono!=null) $('mono').checked=!!p.mono;
  if(p.qrrect!=null) $('qrrect').checked=!!p.qrrect;
  ['n40c','n40l','n30','n50'].forEach(id=>{ if(p[id]!=null) $(id).value=p[id]; });
}

$('city').addEventListener('input', render);
$('tg').addEventListener('input', ()=>{
  if(!loadPage().qrcustom){ $('qrlink').value=tgOf($('tg').value); savePage({qrlink:$('qrlink').value}); }
  render();
});
$('qrlink').addEventListener('input', ()=>{ savePage({qrlink:$('qrlink').value, qrcustom:1}); render(); });
$('sub').addEventListener('input', ()=>{ savePage({sub:$('sub').value}); render(); });
$('mono').addEventListener('change', ()=>{ savePage({mono:$('mono').checked}); render(); });
$('qrrect').addEventListener('change', ()=>{ savePage({qrrect:$('qrrect').checked}); render(); });
['n40c','n40l','n30','n50'].forEach(id=>{ const el=$(id); el.addEventListener('input', ()=>{ savePage({[id]:el.value}); render(); }); });
$('print').addEventListener('click', ()=>window.print());

init(); render();
</script>
</body></html>
