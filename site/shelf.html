<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Стеллаж · NOZZA</title>
<style>
 :root { --bg:#f4f6fb; --panel:#fff; --line:#dde4f1; --text:#17203a; --muted:#64748b;
   --ok:#0f9d58; --bad:#d63a3a; --accent:#4f46e5; --r:12px; }
 @media (prefers-color-scheme: dark) {
  :root { --bg:#0d1220; --panel:#151b30; --line:#263049; --text:#e7ecf7; --muted:#94a3b8; }
 }
 * { box-sizing: border-box; }
 body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
 .wrap { max-width:420px; margin:0 auto; padding:20px 16px 40px; }
 .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
 .name { font-size:17px; font-weight:700; margin:0 0 2px; }
 .muted { color:var(--muted); font-size:12.5px; }
 .price { font-size:30px; font-weight:750; margin:10px 0 4px; font-variant-numeric:tabular-nums; }
 .stock { display:inline-block; font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px; margin-top:6px; }
 .stock.ok { background:rgba(15,157,88,.14); color:var(--ok); }
 .stock.low { background:rgba(201,122,8,.14); color:#c97a08; }
 .stock.empty, .stock.dead { background:rgba(214,58,58,.12); color:var(--bad); }
 .bar { height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:10px; }
 .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
 .btn { display:block; width:100%; margin-top:14px; padding:13px; border:0; border-radius:12px;
   background:var(--accent); color:#fff; font-size:15px; font-weight:650; cursor:pointer; }
 .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); margin-top:8px; }
 .btn:disabled { opacity:.5; cursor:default; }
 .msg { display:none; margin-top:12px; padding:11px; border-radius:10px; font-size:13.5px; font-weight:600; }
 .msg.ok { display:block; background:rgba(15,157,88,.14); color:var(--ok); }
 .msg.err { display:block; background:rgba(214,58,58,.12); color:var(--bad); }
 .logo { text-align:center; margin-bottom:16px; font-weight:750; letter-spacing:.02em; }
 .logo small { display:block; color:var(--muted); font-weight:500; font-size:11.5px; margin-top:2px; }
 form { margin-top:14px; }
 .row { display:flex; gap:8px; }
 .row input { flex:1; min-width:0; padding:12px; border:1px solid var(--line); border-radius:12px;
   background:var(--bg); color:var(--text); font-size:16px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
 <div class="logo">NOZZA<small>Там, где рождается форма</small></div>
 <div class="card">
  <div id="photo"></div>
  <p class="name" id="name">Загрузка…</p>
  <p class="muted" id="note"></p>
  <div class="price" id="price">—</div>
  <span class="stock" id="stock">—</span>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <form id="sellForm" autocomplete="off">
   <div class="row">
    <input id="qty" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="Количество">
    <button class="btn" id="sellBtn" type="submit">Продать 1 шт</button>
   </div>
   <button class="btn ghost" id="backBtn" type="button">← Вернуться в PrintFlow</button>
  </form>
  <div class="msg" id="msg"></div>

  <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
  <p class="name" style="font-size:14px">Заказать или спросить</p>
  <form id="askForm" autocomplete="off">
   <input id="a_name" placeholder="Ваше имя" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;margin-top:8px">
   <input id="a_contact" placeholder="Телефон или Telegram" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;margin-top:8px">
   <input id="a_color" placeholder="Цвет (если нужен)" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;margin-top:8px">
   <button class="btn" id="askBtn" type="submit">Отправить заявку</button>
   <a class="btn ghost" href="/order.html" style="text-align:center;text-decoration:none">Вся витрина NOZZA →</a>
  </form>
  <div class="msg" id="askMsg"></div>
 </div>
</div>
<script>
(function () {
  'use strict';
  var id = new URLSearchParams(location.search).get('id') || '';
  var API = '/api/shelf/item?id=' + encodeURIComponent(id);
  var item = null;

  function $(s) { return document.querySelector(s); }
  function num(v, d) { var n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : (d || 0); }

  function money(v) { return Math.round(num(v)).toLocaleString('ru-RU') + ' ₽'; }

  function showMsg(text, ok) {
    var m = $('#msg');
    m.className = 'msg ' + (ok ? 'ok' : 'err');
    m.textContent = text;
    clearTimeout(showMsg._t);
    showMsg._t = setTimeout(function () { m.className = 'msg'; }, 3500);
  }

  function render() {
    if (!item) return;
    $('#name').textContent = item.name || 'Позиция';
    $('#note').textContent = item.note || 'Позиция стеллажа NOZZA';
    $('#price').textContent = num(item.price) ? money(item.price) : 'Цена в магазине';
    var qty = num(item.qty);
    var st = item.status || 'ok';
    var labels = { ok: 'В наличии: ' + qty + ' шт', low: 'Осталось мало: ' + qty + ' шт',
      dead: 'Под заказ', empty: 'Нет в наличии' };
    var stEl = $('#stock');
    stEl.textContent = labels[st] || labels.ok;
    stEl.className = 'stock ' + (st === 'dead' || st === 'empty' ? 'empty' : st);
    $('#bar').style.width = Math.min(100, qty * 10) + '%';
    $('#sellBtn').disabled = !(qty > 0);
    $('#qty').max = Math.max(1, qty);
    var ph = $('#photo');
    if (item.photo) {
      ph.innerHTML = '<img src="/api/shelf/photo.jpg?id=' + encodeURIComponent(item.id) + '" alt="" style="width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-bottom:12px">';
    } else { ph.innerHTML = ''; }
  }

  function load() {
    fetch(API).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.id) { item = d; render(); }
      else { $('#name').textContent = 'Позиция не найдена'; $('#sellForm').hidden = true; }
    }).catch(function () {
      $('#name').textContent = 'Нет связи с PrintFlow';
      $('#note').textContent = 'Запустите коннектор PrintFlow';
      $('#sellForm').hidden = true;
    });
  }

  $('#sellForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!item) return;
    var qty = Math.max(1, parseInt($('#qty').value, 10) || 1);
    fetch('/api/shelf/sale', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item_id: item.id, qty: qty, channel: 'shelf', note: 'продажа по QR' }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        showMsg('Продано ' + qty + ' шт ✓', true);
        item.qty = num(item.qty) - qty;
        $('#qty').value = 1;
        render();
      } else {
        showMsg(d.error || 'Не получилось', false);
        load();
      }
    }).catch(function () { showMsg('Нет связи с коннектором', false); });
  });

  $('#backBtn').addEventListener('click', function () {
    var url = '/index.html#shelf';
    var ref = document.referrer;
    if (ref && ref.indexOf(location.host) !== -1) { location.href = ref; return; }
    location.href = url;
  });

  function askMsg(text, ok) {
    var m = $('#askMsg');
    m.className = 'msg ' + (ok ? 'ok' : 'err');
    m.textContent = text;
    clearTimeout(askMsg._t);
    askMsg._t = setTimeout(function () { m.className = 'msg'; }, 4000);
  }

  $('#askForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!item) return;
    var name = $('#a_name').value.trim();
    var contact = $('#a_contact').value.trim();
    if (!name) return askMsg('Укажите имя', false);
    if (!contact) return askMsg('Оставьте телефон или Telegram', false);
    fetch('/api/public/order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: name,
        phone: /^\+?\d[\d\s()-]{5,}$/.test(contact) ? contact : '',
        messenger: /^\+?\d[\d\s()-]{5,}$/.test(contact) ? '' : contact,
        product: item.name || 'Позиция стеллажа',
        color: $('#a_color').value.trim(),
        qty: 1,
        channel: 'shop',
        note: 'Заявка со страницы товара',
      }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        askMsg('Заявка №' + d.order_number + ' принята! Мы свяжемся с вами.', true);
        $('#a_name').value = ''; $('#a_contact').value = ''; $('#a_color').value = '';
      } else askMsg(d.error || 'Не получилось', false);
    }).catch(function () { askMsg('Нет связи с коннектором', false); });
  });

  load();
  setInterval(function () { if (document.visibilityState === 'visible') load(); }, 15000);
})();
</script>
</body>
</html>
