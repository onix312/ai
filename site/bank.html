<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<title>NOZZA · Поступления из банка</title>
<link rel="stylesheet" href="assets/tokens.css?v=16.0.0">
<style>
 * { box-sizing:border-box; margin:0; padding:0; }
 body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
 .wrap { max-width:640px; margin:0 auto; padding:18px 14px 44px; }
 .top { display:flex; align-items:center; gap:11px; margin-bottom:14px; }
 .top img { width:36px; height:36px; }
 .top b { font-size:17px; }
 .top small { display:block; color:var(--muted); font-size:11.5px; }
 .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
 .card h3 { font-size:14px; margin-bottom:10px; }
 textarea { width:100%; min-height:110px; padding:12px; border:1px solid var(--line); border-radius:11px;
   background:var(--bg); color:var(--text); font-size:12.5px; font-family:ui-monospace,Menlo,Consolas,monospace; }
 .row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
 .row:last-child { border-bottom:0; }
 .row .t { flex:1; min-width:0; }
 .row b { font-size:13.5px; }
 .row small { display:block; color:var(--muted); font-size:11px; margin-top:1px; }
 .amt { font-weight:750; font-size:15px; white-space:nowrap; }
 .btn { padding:11px 13px; border:0; border-radius:11px; font-weight:700; font-size:13px; cursor:pointer; color:#fff; }
 .btn:active { transform:scale(.97); }
 .btn.ok { background:var(--ok); }
 .btn.warn { background:var(--warn); }
 .btn.bad { background:var(--bad); }
 .btn.ghost { background:var(--line); color:var(--text); }
 .badge { font-size:10.5px; font-weight:750; padding:3px 8px; border-radius:99px; white-space:nowrap; }
 .badge.confirmed { background:rgba(46,160,67,.18); color:var(--ok); }
 .badge.matched { background:rgba(79,70,229,.18); color:var(--accent); }
 .badge.review { background:rgba(217,138,42,.18); color:var(--warn); }
 .badge.unmatched { background:rgba(214,58,58,.16); color:var(--bad); }
 .badge.new { background:var(--line); color:var(--muted); }
 .empty { color:var(--muted); font-size:13px; text-align:center; padding:10px 0; }
 .hint { font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.5; }
 input { width:100%; margin-top:6px; padding:11px; border:1px solid var(--line); border-radius:10px;
   background:var(--bg); color:var(--text); font-size:14px; }
 label { display:block; font-size:12.5px; color:var(--muted); }
 .msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#fff; color:#12203c;
   padding:11px 17px; border-radius:11px; font-size:13px; font-weight:650; box-shadow:0 8px 30px -10px rgba(0,0,0,.6);
   opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; z-index:60; }
 .msg.on { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <img src="assets/brand/nozza-mark-white.svg" alt="">
  <div><b>Поступления из банка</b><small>авто-подтверждение СБП · строгое правило</small></div>
 </div>

 <div class="card">
  <h3>Импорт выписки Т-Банка</h3>
  <textarea id="csv" placeholder="Вставьте CSV выписки (колонки «Дата операции», «Сумма», «Назначение»…)"></textarea>
  <div style="display:flex;gap:8px;margin-top:10px">
   <button class="btn ok" id="bImport" type="button" style="flex:1">Разнести выписку</button>
  </div>
  <div class="hint" id="importResult"></div>
 </div>

 <div class="card">
  <h3>На сверку <span class="hint" id="reviewCount"></span></h3>
  <div id="review"></div>
 </div>

 <div class="card">
  <h3>Последние</h3>
  <div id="recent"></div>
 </div>
</div>
<div class="msg" id="msg"></div>
<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var state = { review: [], recent: [], auto: true };

function toast(t) { var m = $("msg"); m.textContent = t; m.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ m.classList.remove("on"); }, 3000); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
function money(v) { var n = Number(v) || 0; return (Math.round(n*100)/100).toLocaleString("ru-RU") + " ₽"; }
function api(path, body) {
  return fetch(path, { method: body ? "POST" : "GET",
    headers: body ? { "Content-Type":"application/json" } : {},
    body: body ? JSON.stringify(body) : undefined }).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.error ? j.error : ("HTTP "+r.status)); return j; });
  });
}
function badge(s) {
  var names = { new:"новая", matched:"связана", confirmed:"подтверждена", review:"на сверку", unmatched:"не сопоставлена" };
  return '<span class="badge ' + esc(s) + '">' + (names[s] || esc(s)) + "</span>";
}
function rowHtml(r) {
  var linkBtn = (r.status === "unmatched" || r.status === "review")
    ? '<button class="btn warn" data-act="link" data-id="' + esc(r.id) + '" style="padding:9px 11px;font-size:12px">Связать</button>' : "";
  var confirmBtn = (r.status === "matched" || r.status === "new")
    ? '<button class="btn ok" data-act="confirm" data-id="' + esc(r.id) + '" style="padding:9px 11px;font-size:12px">Подтвердить</button>' : "";
  return '<div class="row"><div class="t"><b>' + money(r.amount) + "</b> " + badge(r.status) +
    "<small>" + esc(r.purpose || "—") +
    (r.counterparty ? (" · " + esc(r.counterparty)) : "") +
    (r.payment_number ? (" · СБП №" + esc(r.payment_number)) : "") +
    (r.note ? (" · " + esc(r.note)) : "") + "</small></div>" +
    '<div style="display:flex;gap:6px">' + linkBtn + confirmBtn + "</div></div>";
}
function render() {
  $("reviewCount").textContent = state.review.length ? ("· " + state.review.length) : "";
  $("review").innerHTML = state.review.length ? state.review.map(rowHtml).join("")
    : '<div class="empty">Нет поступлений на сверке</div>';
  $("recent").innerHTML = state.recent.length ? state.recent.slice(0, 15).map(rowHtml).join("")
    : '<div class="empty">Поступлений пока нет</div>';
}
function load() {
  api("/api/bank/state").then(function (s) {
    state.review = s.pending_review || []; state.recent = s.recent || []; state.auto = !!s.auto_confirm;
    render();
  }).catch(function (e) { toast("Ошибка: " + e.message); });
}
$("bImport").addEventListener("click", function () {
  var csv = $("csv").value;
  if (!csv.trim()) { toast("Вставьте выписку"); return; }
  api("/api/bank/import", { csv: csv, actor: "panel" }).then(function (r) {
    $("importResult").textContent = "новых: " + r.new + " · подтверждено: " + r.confirmed +
      " · на сверку: " + r.matched + " · не сопоставлено: " + r.unmatched + " · пропущено: " + r.skipped;
    $("csv").value = ""; load();
  }).catch(function (e) { toast("Ошибка: " + e.message); });
});
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
  if (act === "link") {
    var ident = prompt("СБП-платёж (id или номер):", "");
    if (ident === null) return;
    api("/api/bank/link", { receipt_id: id, payment_id: ident, actor: "panel" })
      .then(function () { toast("Связано ✓"); load(); })
      .catch(function (e) { toast("Ошибка: " + e.message); });
  } else if (act === "confirm") {
    if (!confirm("Подтвердить платёж по этому поступлению?")) return;
    api("/api/bank/confirm", { receipt_id: id, actor: "panel" })
      .then(function () { toast("Подтверждено ✓"); load(); })
      .catch(function (e) { toast("Ошибка: " + e.message); });
  }
});
load();
</script>
</body>
</html>
