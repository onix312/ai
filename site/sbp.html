<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<script src="/assets/theme-init.js?v=18.23.1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<title>NOZZA · СБП · входящие</title>
<link rel="stylesheet" href="assets/tokens.css?v=18.23.1">
<style>
 * { box-sizing:border-box; margin:0; padding:0; }
 body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
 .wrap { max-width:560px; margin:0 auto; padding:18px 14px 44px; }
 .top { display:flex; align-items:center; gap:11px; margin-bottom:14px; }
 .top img { width:36px; height:36px; }
 .top b { font-size:17px; }
 .top small { display:block; color:var(--muted); font-size:11.5px; }
 .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
 .card h3 { font-size:14px; margin-bottom:10px; }
 .row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
 .row:last-child { border-bottom:0; }
 .row .t { flex:1; min-width:0; }
 .row b { font-size:13.5px; }
 .row small { display:block; color:var(--muted); font-size:11px; margin-top:1px; }
 .amt { font-weight:750; font-size:15px; white-space:nowrap; }
 .btn { padding:11px 13px; border:0; border-radius:11px; font-weight:700; font-size:13px; cursor:pointer; color:#fff; }
 .btn:active { transform:scale(.97); }
 .btn.ok { background:var(--ok); }
 .btn.warn { background:var(--warn); }
 .btn.bad { background:var(--bad); }
 .btn.ghost { background:var(--line); color:var(--text); }
 .badge { font-size:10.5px; font-weight:750; padding:3px 8px; border-radius:99px; white-space:nowrap; }
 .badge.pending { background:rgba(217,138,42,.18); color:var(--warn); }
 .badge.new { background:var(--line); color:var(--muted); }
 .badge.confirmed { background:rgba(46,160,67,.18); color:var(--ok); }
 .badge.rejected { background:rgba(214,58,58,.16); color:var(--bad); }
 .badge.refunded { background:rgba(148,163,184,.2); color:var(--muted); }
 input { width:100%; margin-top:6px; padding:12px; border:1px solid var(--line); border-radius:11px;
   background:var(--bg); color:var(--text); font-size:15px; }
 label { display:block; font-size:12.5px; color:var(--muted); }
 .hint { font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
 .empty { color:var(--muted); font-size:13px; text-align:center; padding:10px 0; }
 .msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#fff; color:#12203c;
   padding:11px 17px; border-radius:11px; font-size:13px; font-weight:650; box-shadow:0 8px 30px -10px rgba(0,0,0,.6);
   opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; }
 .msg.on { opacity:1; }
 .muted { color:var(--muted); }
 .qrbox { display:flex; justify-content:center; margin-top:12px; }
 .qrbox svg { width:min(220px,60vw); height:auto; background:#fff; padding:10px; border-radius:14px; }
 @media print { body * { visibility:hidden; } .qrbox, .qrbox * { visibility:visible; }
   .qrbox { position:absolute; inset:0; align-items:center; } }
</style>
<link rel="stylesheet" href="assets/refine.css?v=18.23.1">
<link rel="stylesheet" href="/assets/nozza-design-v2.css?v=20.1.35">
<style>
@media screen {
 body.pf-utility.pf-sbp-page { --bg:#0B121B;--panel:#16212E;--line:#2D4052;--text:#F2F6FB;--muted:#A0B2C5;--ok:#50CBA5;--warn:#F3C66B;--bad:#FB8EA4;--accent:#818CF8;min-height:100vh;background:#0B121B;color:#F2F6FB; }
 body.pf-utility.pf-sbp-page .wrap { max-width:740px;padding:18px 14px 44px; }
 body.pf-utility.pf-sbp-page .card { padding:14px;border:1px solid #2D4052;border-radius:16px;background:#16212E;color:#F2F6FB;box-shadow:none; }
 body.pf-utility.pf-sbp-page .card h3 { color:#F2F6FB; }
 body.pf-utility.pf-sbp-page .top small,body.pf-utility.pf-sbp-page .muted,body.pf-utility.pf-sbp-page .hint { color:#A0B2C5; }
 body.pf-utility.pf-sbp-page .row { border-color:#2D4052; }
 body.pf-utility.pf-sbp-page input { min-height:46px;border-color:#2D4052;border-radius:11px;background:#1E2B3A;color:#F2F6FB; }
 body.pf-utility.pf-sbp-page .btn { min-height:42px;padding:10px 13px;border-radius:10px; }
 body.pf-utility.pf-sbp-page .btn.ok { background:#50CBA5;color:#10251F; }
 body.pf-utility.pf-sbp-page .btn.warn { background:#F3C66B;color:#38290A; }
 body.pf-utility.pf-sbp-page .btn.bad { background:#FB8EA4;color:#39131C; }
 body.pf-utility.pf-sbp-page .btn.ghost { border:1px solid #2D4052;background:#1E2B3A;color:#F2F6FB; }
 body.pf-utility.pf-sbp-page .badge.pending { background:rgba(243,198,107,.17);color:#F3C66B; }
 body.pf-utility.pf-sbp-page .badge.confirmed { background:rgba(80,203,165,.16);color:#50CBA5; }
 body.pf-utility.pf-sbp-page .badge.rejected { background:rgba(251,142,164,.15);color:#FB8EA4; }
 body.pf-utility.pf-sbp-page .badge.new,body.pf-utility.pf-sbp-page .badge.refunded { background:#243547;color:#A0B2C5; }
 body.pf-utility.pf-sbp-page .empty.unavailable { padding:22px 12px;border:2px solid #2D4052;border-radius:0;background:transparent;color:#A0B2C5; }
 body.pf-utility.pf-sbp-page .msg { background:#16212E;color:#F2F6FB;border:1px solid #2D4052; }
}
@media (max-width:420px) { body.pf-utility.pf-sbp-page .wrap { padding:16px 12px 34px; } }
</style>
</head>
<body class="pf-utility pf-sbp-page">
<div class="wrap">
 <div class="top">
  <img src="assets/brand/nozza-mark-white.svg" alt="">
  <div><b>СБП · входящие платежи</b><small>ручное подтверждение поступления</small></div>
 </div>

 <div class="card">
  <h3>Новый платёж по заказу</h3>
  <label>Номер заказа<input id="orderNum" inputmode="numeric" placeholder="Например: 1001"></label>
  <div id="orderInfo" class="hint" hidden></div>
  <label>Сумма<input id="amount" inputmode="decimal" placeholder="₽"></label>
  <div style="display:flex;gap:8px;margin-top:12px">
   <button class="btn ok" id="bCreate" type="button" style="flex:1">Создать платёж</button>
  </div>
 </div>

 <div class="card">
  <h3>Ожидают подтверждения <span class="muted" id="pendingCount"></span></h3>
  <div id="pending"></div>
 </div>

 <div class="card">
  <h3>Последние</h3>
  <div id="recent"></div>
 </div>

 <div class="card" id="settingsCard">
  <h3>Настройки СБП</h3>
  <div id="settings" class="hint"></div>
  <div class="qrbox" id="shopQr" hidden></div>
  <div id="qrInfo" class="hint"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
   <button class="btn ghost" id="bPrintQr" type="button" style="flex:1" hidden>Распечатать QR на кассу</button>
  </div>
 </div>
</div>
<div class="msg" id="msg"></div>
<script src="/assets/qr.js?v=18.23.1"></script>
<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
var state = { orderId: "", debt: 0, pending: null, recent: null, pins: false };

// Право на деньги: когда в «Команде» заведены PIN, панель спрашивает его —
// иначе любой запрос из LAN записал бы выручку или возврат (Касса 16.0,
// решение №9 «возвраты — только руководитель», теперь оно на сервере).
function askPin(what) {
  if (!state.pins) return "";
  var pin = prompt(what + " — введите PIN сотрудника");
  if (pin === null) return null;
  pin = String(pin).trim();
  if (!pin) { toast("Нужен PIN"); return null; }
  return pin;
}
// Одна кнопка — один запрос: двойной тап и повтор после обрыва не должны
// гонять денежную операцию второй раз (на сервере это тоже защищено).
function guard(btn, run) {
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  Promise.resolve().then(run).catch(function (e) { toast("Ошибка: " + e.message); })
    .then(function () { btn.disabled = false; });
}

function toast(text) {
  var m = $("msg"); m.textContent = text; m.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function () { m.classList.remove("on"); }, 2600);
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function money(v) { if (v == null || v === "") return "—"; var n = Number(v); return isFinite(n) ? (Math.round(n * 100) / 100) + " ₽" : "—"; }

function api(path, body) {
  return fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) { return r.json().then(function (j) {
    if (!r.ok) { throw new Error(j && j.error ? j.error : ("HTTP " + r.status)); }
    return j;
  }); });
}
function reqId() { return "ui-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10); }

function badge(status) {
  var names = { new: "новая", pending: "ожидает", confirmed: "подтверждена", rejected: "отклонена", refunded: "возврат" };
  return '<span class="badge ' + esc(status) + '">' + (names[status] || esc(status)) + "</span>";
}

function renderPending() {
  var box = $("pending");
  if (!Array.isArray(state.pending)) {
    $("pendingCount").textContent = "· —";
    box.innerHTML = '<div class="empty unavailable">Входящие платежи недоступны. Проверьте подключение к PrintFlow.</div>';
    return;
  }
  $("pendingCount").textContent = state.pending.length ? ("· " + state.pending.length) : "";
  if (!state.pending.length) { box.innerHTML = '<div class="empty">Нет платежей, ожидающих сверки</div>'; return; }
  box.innerHTML = state.pending.map(function (p) {
    return '<div class="row">' +
      '<div class="t"><b>№' + esc(p.number) + " · " + money(p.amount) + "</b>" +
      "<small>" + esc(p.purpose || "—") +
      (p.order_number ? (" · заказ №" + esc(p.order_number)) : "") +
      (itemsText(p) ? ("<br>Состав: " + esc(itemsText(p))) : "") + "</small></div>" +
      '<button class="btn ok" data-act="confirm" data-id="' + esc(p.id) + '">Подтвердить</button>' +
      '<button class="btn warn" data-act="reject" data-id="' + esc(p.id) + '">Отклонить</button>' +
      "</div>";
  }).join("");
}

function renderRecent() {
  var box = $("recent");
  if (!Array.isArray(state.recent)) {
    box.innerHTML = '<div class="empty unavailable">История платежей недоступна. Проверьте подключение к PrintFlow.</div>';
    return;
  }
  if (!state.recent.length) { box.innerHTML = '<div class="empty">Платежей пока нет</div>'; return; }
  box.innerHTML = state.recent.map(function (p) {
    var refund = p.status === "confirmed"
      ? '<button class="btn bad" data-act="refund" data-id="' + esc(p.id) + '">Возврат</button>' : "";
    return '<div class="row">' +
      '<div class="t"><b>№' + esc(p.number) + " · " + money(p.amount) + "</b> " + badge(p.status) +
      "<small>" + esc(p.purpose || "—") +
      (p.order_number ? (" · заказ №" + esc(p.order_number)) : "") +
      (p.confirmed_by ? (" · " + esc(p.confirmed_by)) : "") +
      (itemsText(p) ? ("<br>Состав: " + esc(itemsText(p))) : "") + "</small></div>" +
      '<div style="display:flex;gap:6px">' + refund + "</div></div>";
  }).join("");
}

function renderPaymentQr(q) {
  var box = $("shopQr"), btn = $("bPrintQr"), info = $("qrInfo");
  var svg = q.svg || (q.text && window.QR ? window.QR.svg(q.text, { size: 220, margin: 2 }) : "");
  box.innerHTML = svg; box.hidden = !svg; btn.hidden = !svg;
  var kind = { gost: "Свой QR по реквизитам (ГОСТ Р 56042-2014): сумма и назначение внутри",
               link: "Платёжная ссылка банка",
               static: "Статический QR магазина (СБП): сумму вводит покупатель",
               dynamic: "Динамический QR банка" }[q.kind] || "";
  var d = q.diagnostics || {};
  var problems = (q.problems || []).map(function (p) {
    return "• " + esc(p.label) + " — " + esc(p.message); }).join("<br>");
  info.innerHTML = [kind,
    q.purpose ? "Назначение: " + esc(q.purpose) : "",
    d.why ? esc(d.why) : "",
    d.can_open ? "Открывается кнопкой «Открыть оплату»" + (d.domain ? " (" + esc(d.domain) + ")" : "") : "",
    (q.camera && q.kind === "gost")
      ? "«QR для камеры» включён, но ссылку дать нечем: камера покажет текст. Заполните «Ссылку для оплаты» или статический QR магазина — и телефон откроет банк." : "",
    d.purpose_truncated ? "Назначение в QR сокращено — полное в платеже" : "",
    q.hint ? esc(q.hint) : "", problems].filter(Boolean).join("<br>");
}

function itemsText(p) {
  try {
    var arr = JSON.parse(p.items || "[]");
    if (!arr || !arr.length) return "";
    var s = arr.map(function (r) { return (r.name || "?") + " × " + (r.qty == null ? 1 : r.qty); }).join("; ");
    return s.length > 200 ? s.slice(0, 200) + "…" : s;
  } catch (e) { return ""; }
}

function renderSettings(s) {
  $("settings").innerHTML = [
    s.enabled ? "Приём СБП включён" : "<b>Приём СБП отключён в настройках</b>",
    "Счёт: " + esc(s.account_name || "—") + " (" + esc(s.account_id || "—") + ")",
    s.bank_name ? "Банк: " + esc(s.bank_name) : "",
    s.shop_qr ? "Статический QR магазина задан" : "Статический QR магазина не задан (настройка sbp_shop_qr)",
  ].filter(Boolean).join("<br>");
}

document.addEventListener("click", function (ev) {
  if (ev.target && ev.target.id === "bPrintQr") window.print();
});

function load() {
  api("/api/sbp/state").then(function (s) {
    state.pending = s.pending || [];
    state.recent = s.recent || [];
    state.pins = !!((s.settings || {}).pins_required);
    renderPending();
    renderRecent();
    renderSettings(s.settings || {});
  }).catch(function (e) {
    state.pending = null; state.recent = null;
    renderPending(); renderRecent();
    $("settings").textContent = "Настройки СБП недоступны без подключения к PrintFlow.";
    toast("Нет связи с PrintFlow: " + e.message);
  });
  // Платёжный QR на примере 1000 ₽: видно, что именно покажет касса.
  api("/api/payment/qr?amount=1000&purpose=" + encodeURIComponent("Оплата в магазине"))
    .then(renderPaymentQr).catch(function () { $("qrInfo").textContent = "Платёжные настройки и QR недоступны без подключения к PrintFlow."; });
}

$("orderNum").addEventListener("change", function () {
  var num = this.value.trim();
  if (!num) { state.orderId = ""; state.debt = 0; $("orderInfo").hidden = true; return; }
  api("/api/orders?q=" + encodeURIComponent(num)).then(function (r) {
    var list = (r.orders || []).filter(function (o) { return String(o.number) === num; });
    if (!list.length) list = r.orders || [];
    if (!list.length) { state.orderId = ""; state.debt = 0;
      $("orderInfo").hidden = false; $("orderInfo").textContent = "Заказ не найден"; return; }
    var o = list[0], debt = Number((o.economics && o.economics.debt) || 0);
    state.orderId = o.id; state.debt = Math.max(0, debt);
    $("orderInfo").hidden = false;
    $("orderInfo").textContent = o.number + " · " + (o.product || "") + " · долг " + money(state.debt);
    if (!$("amount").value) $("amount").value = Math.round(state.debt * 100) / 100;
  }).catch(function (e) { toast("Ошибка: " + e.message); });
});

$("bCreate").addEventListener("click", function () {
  var amount = parseFloat($("amount").value);
  if (!state.orderId) { toast("Сначала укажите номер заказа"); return; }
  if (!(amount > 0)) { toast("Сумма должна быть больше нуля"); return; }
  if (!confirm("Создать СБП-платёж " + money(amount) + " по заказу №" + $("orderNum").value.trim() + "?")) return;
  api("/api/sbp/create", { order_id: state.orderId, amount: amount, request_id: reqId(), actor: "panel" })
    .then(function (p) {
      toast(p.already_recorded ? "Такой платёж уже есть" : "Платёж создан — ожидает сверки");
      $("orderNum").value = ""; $("amount").value = ""; $("orderInfo").hidden = true;
      state.orderId = ""; state.debt = 0; load();
    }).catch(function (e) { toast("Ошибка: " + e.message); });
});

document.addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
  if (act === "confirm") {
    if (!confirm("Подтвердить поступление? Деньги будут записаны в журнал и закроют долг заказа.")) return;
    var pin = askPin("Подтверждение СБП-оплаты");
    if (pin === null) return;
    guard(b, function () {
      return api("/api/sbp/confirm", { id: id, actor: "panel", pin: pin, request_id: "confirm-" + id })
        .then(function () { toast("Оплата подтверждена ✓"); load(); });
    });
  } else if (act === "reject") {
    var reason = prompt("Причина отклонения:", "Оплата не поступила");
    if (reason === null) return;
    var rpin = askPin("Отклонение платежа");
    if (rpin === null) return;
    guard(b, function () {
      return api("/api/sbp/reject", { id: id, reason: reason, actor: "panel", pin: rpin })
        .then(function () { toast("Платёж отклонён"); load(); });
    });
  } else if (act === "refund") {
    if (!confirm("Возврат СБП. Подтверждаю: возврат выполнен в банке.")) return;
    var fpin = askPin("Возврат денег — только старший");
    if (fpin === null) return;
    guard(b, function () {
      return api("/api/sbp/refund", { id: id, bank_done: "1", note: "возврат клиенту",
                                     actor: "owner", pin: fpin })
        .then(function () { toast("Возврат проведён ✓"); load(); });
    });
  }
});

load();
</script>
<script src="/assets/theme-toggle.js?v=18.23.1" defer></script>
</body>
