<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NOZZA · Цех</title>
<link rel="stylesheet" href="/assets/tokens.css?v=18.6.0">
<style>
 [hidden]{display:none!important}
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
 .swrap{max-width:860px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px 92px}
 .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
 .brand{display:flex;align-items:center;gap:9px}
 .brand img{width:32px;height:32px}
 .brand b{font-size:16px;display:block}
 .brand small{display:block;color:var(--muted);font-size:11px}
 .pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--panel);border:1px solid var(--line)}
 .pill.ok{color:var(--ok);border-color:var(--ok)}
 .pill.bad{color:var(--bad);border-color:var(--bad)}
 .pill.warn{color:var(--warn);border-color:var(--warn)}
 .top-right{margin-left:auto;text-align:right}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
 .card h3{font-size:15px;margin-bottom:8px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 @media(max-width:560px){.grid2{grid-template-columns:1fr}}
 .kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
 .kv:last-child{border-bottom:0}
 .kv b{font-variant-numeric:tabular-nums}
 .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
 .btn.go{background:var(--ok);color:#fff;border-color:transparent}
 .btn:active{transform:scale(.98)}
 .btn:disabled{opacity:.45}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%, #000);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
 .tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;gap:2px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
 .tab.on{color:var(--text);background:var(--panel);border-color:var(--line)}
 .tab .badge{position:absolute;top:4px;right:calc(50% - 24px);min-width:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;text-align:center}
 .tab .badge[hidden]{display:none}
 .screen[hidden]{display:none}
 .list{display:grid;gap:8px}
 .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2,transparent)}
 .row b{font-size:14px}
 .row small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
 .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13px;background:var(--panel);border:1px dashed var(--line);border-radius:16px}
 .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
 .msg{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;background:#fff;color:#12203c;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:650;box-shadow:0 8px 30px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
 .msg.on{opacity:1}
 .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font-size:15px;outline:0;margin-bottom:10px}
</style>
</head>
<body>
<div class="swrap">
 <div class="top">
  <div class="brand">
   <img src="/assets/brand/nozza-mark-white.svg" alt="">
   <span><b>Цех NOZZA</b><small id="who">загрузка…</small></span>
  </div>
  <div class="top-right">
   <span class="pill" id="net">подключаюсь…</span>
  </div>
 </div>

 <main>
  <section class="screen" id="screen_home">
   <div class="grid2" id="home_stats"></div>
   <div class="card">
    <h3>Быстрые действия</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
     <button class="btn" data-go="orders">Заказы</button>
     <button class="btn" data-go="queue">Очередь</button>
     <button class="btn" data-go="printers">Принтеры</button>
     <button class="btn" data-go="shelf">Полка</button>
    </div>
   </div>
   <div class="card" id="home_alerts" hidden></div>
  </section>

  <section class="screen" id="screen_shelf" hidden>
   <h3 style="margin:8px 0">Полка · стеллаж</h3>
   <input class="search" id="shelf_search" placeholder="Поиск по товару…">
   <div class="list" id="shelf_list"></div>
  </section>

  <section class="screen" id="screen_orders" hidden>
   <h3 style="margin:8px 0">Заказы</h3>
   <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    <button class="btn" data-ostatus="all">Все</button>
    <button class="btn" data-ostatus="ready">Готов</button>
    <button class="btn" data-ostatus="in_progress">В работе</button>
    <button class="btn" data-ostatus="new">Новые</button>
   </div>
   <div class="list" id="orders_list"></div>
  </section>

  <section class="screen" id="screen_queue" hidden>
   <h3 style="margin:8px 0">Очередь печати</h3>
   <div class="list" id="queue_list"></div>
  </section>

  <section class="screen" id="screen_printers" hidden>
   <h3 style="margin:8px 0">Принтеры</h3>
   <div class="list" id="printers_list"></div>
  </section>

  <section class="screen" id="screen_inbox" hidden>
   <h3 style="margin:8px 0">Inbox · клиенты</h3>
   <div class="list" id="inbox_list"></div>
  </section>

  <section class="screen" id="screen_money" hidden>
   <h3 style="margin:8px 0">Деньги</h3>
   <div id="money_box"></div>
  </section>

  <section class="screen" id="screen_team" hidden>
   <h3 style="margin:8px 0">Команда</h3>
   <div id="team_box"></div>
  </section>
 </main>
</div>

<nav class="tabs" aria-label="Разделы цеха">
 <button class="tab on" data-screen="home">Цех</button>
 <button class="tab" data-screen="shelf">Полка</button>
 <button class="tab" data-screen="orders">Заказы<span class="badge" id="badge_orders" hidden>0</span></button>
 <button class="tab" data-screen="queue">Очередь</button>
 <button class="tab" data-screen="printers">Парк</button>
</nav>

<div class="msg" id="msg"></div>

<script src="/assets/js/staff-miniapp.js?v=19.0.0"></script>
</body>
</html>
