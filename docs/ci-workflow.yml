name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Статика и целостность
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Инструменты
        run: python -m pip install --disable-pip-version-check ruff
      - name: Быстрые проверки
        run: python scripts/check.py --quick --require-tools

  tests:
    name: Тесты · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: connector/requirements.txt
      - name: Runtime-зависимости
        run: python -m pip install --disable-pip-version-check -r connector/requirements.txt
      - name: Unit-тесты
        run: python -m unittest discover -s connector/tests -v

  smoke:
    name: Дымовой тест сервера
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XDG_CONFIG_HOME: ${{ runner.temp }}/printflow-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: connector/requirements.txt
      - name: Runtime-зависимости
        run: python -m pip install --disable-pip-version-check -r connector/requirements.txt
      - name: Сервер поднимается и отвечает
        shell: bash
        run: |
          set -euo pipefail
          python connector/printflow_connector.py --port 8099 --no-browser --no-banner &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8099/api/health > health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"ok": true' health.json
          curl --fail --silent http://127.0.0.1:8099/api/bootstrap > /dev/null
          curl --fail --silent http://127.0.0.1:8099/ | grep -q "PrintFlow"
          curl --fail --silent http://127.0.0.1:8099/manifest.webmanifest > /dev/null
