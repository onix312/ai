name: native-ui

on:
  pull_request:
    paths:
      - "agent/native_ui/**"
      - "agent/server.py"
      - "agent/brain.py"
      - "agent/task_engine.py"
      - "agent/voice_runtime.py"
      - "agent/window.py"
      - "agent/capabilities.py"
      - "agent/requirements.txt"
      - "connector/tests/test_native_ui.py"
      - "connector/tests/test_agent_brain.py"
      - "connector/tests/test_task_engine.py"
      - "connector/tests/test_voice_runtime.py"
      - "docs/NATIVE-UI-2-PHASE1.md"
      - "docs/NATIVE-UI-2.md"
      - ".github/workflows/native-ui.yml"
  push:
    branches:
      - "feature/nozza-pyside6-ui"
    paths:
      - "agent/native_ui/**"
      - "agent/window.py"
      - "agent/capabilities.py"
      - "agent/requirements.txt"
      - "connector/tests/test_native_ui.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile native UI
        run: python -m compileall -q agent/native_ui agent/server.py agent/brain.py agent/task_engine.py agent/voice_runtime.py agent/window.py agent/capabilities.py
      - name: Native UI contract tests
        run: >-
          python -m unittest
          connector.tests.test_native_ui
          connector.tests.test_agent_brain.ServerSecurityTests
          connector.tests.test_task_engine
          connector.tests.test_voice_runtime


  windows-ui-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PySide6
        run: python -m pip install "PySide6>=6.7,<7"
      - name: PySide6 window smoke test
        run: python -m unittest connector.tests.test_native_ui_qt
