name: luma-packaging

on:
  pull_request:
    paths:
      - "luma.py"
      - "agent/desktop.py"
      - "agent/luma.spec"
      - "agent/requirements.txt"
      - "scripts/build_luma_windows.ps1"
      - "scripts/install_luma_windows.ps1"
      - "connector/tests/test_luma_packaging.py"
      - ".github/workflows/luma-packaging.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile desktop host
        run: python -m compileall -q luma.py agent/desktop.py
      - name: Packaging contracts
        run: python -m unittest connector.tests.test_luma_packaging

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build standalone package
        shell: powershell
        run: .\scripts\build_luma_windows.ps1 -Clean
      - name: Verify package
        shell: powershell
        run: |
          if (-not (Test-Path ".\dist\LumaPackage\app\Luma.exe")) { throw "Luma.exe missing" }
          if (-not (Test-Path ".\dist\LumaPackage\install.ps1")) { throw "installer missing" }
          if (-not (Test-Path ".\dist\LumaPackage\INSTALL-LUMA.bat")) { throw "double-click installer missing" }
      - name: Upload Luma package
        uses: actions/upload-artifact@v4
        with:
          name: LumaPackage-Windows
          path: dist/LumaPackage
          if-no-files-found: error
