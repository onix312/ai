name: replan

on:
  pull_request:
    paths:
      - "agent/replanner.py"
      - "agent/task_engine.py"
      - "agent/server.py"
      - "agent/native_ui/**"
      - "connector/tests/test_replanner.py"
      - "connector/tests/test_native_ui_qt.py"
      - ".github/workflows/replan.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile agent
        run: python -m compileall -q agent
      - name: Replan and task contracts
        run: python -m unittest connector.tests.test_replanner connector.tests.test_agent_planner connector.tests.test_task_engine connector.tests.test_verifier

  windows-ui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PySide6
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Native Tasks UI smoke
        run: python -m unittest connector.tests.test_native_ui_qt
