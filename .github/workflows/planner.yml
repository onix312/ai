name: planner

on:
  pull_request:
    paths:
      - "agent/planner.py"
      - "agent/brain.py"
      - "agent/server.py"
      - "agent/native_ui/**"
      - "connector/tests/test_agent_planner.py"
      - "connector/tests/test_agent_brain.py"
      - "connector/tests/test_native_ui.py"
      - "connector/tests/test_native_ui_qt.py"
      - ".github/workflows/planner.yml"
  push:
    branches:
      - "feature/nozza-planner-v1"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Planner
        run: python -m compileall -q agent/planner.py agent/brain.py agent/server.py agent/native_ui
      - name: Planner tests
        run: >-
          python -m unittest
          connector.tests.test_agent_planner
          connector.tests.test_agent_brain.BrainChatTests
          connector.tests.test_native_ui

  windows-ui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PySide6
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Planner UI smoke
        run: python -m unittest connector.tests.test_native_ui_qt
