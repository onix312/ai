name: task-engine

on:
  pull_request:
    paths:
      - "agent/task_engine.py"
      - "agent/server.py"
      - "agent/brain.py"
      - "agent/native_ui/**"
      - "connector/tests/test_task_engine.py"
      - "connector/tests/test_agent_brain.py"
      - "connector/tests/test_native_ui.py"
      - "connector/tests/test_native_ui_qt.py"
      - ".github/workflows/task-engine.yml"
  push:
    branches:
      - "feature/nozza-task-engine-v1"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Task Engine
        run: python -m compileall -q agent/task_engine.py agent/server.py agent/brain.py agent/native_ui
      - name: Task Engine tests
        run: >-
          python -m unittest
          connector.tests.test_task_engine
          connector.tests.test_agent_brain.BrainChatTests
          connector.tests.test_native_ui

  windows-ui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PySide6
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Task UI smoke
        run: python -m unittest connector.tests.test_native_ui_qt
