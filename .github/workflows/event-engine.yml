name: event-engine

on:
  pull_request:
    paths:
      - "agent/event_engine.py"
      - "agent/server.py"
      - "agent/native_ui/**"
      - "connector/tests/test_event_engine.py"
      - "connector/tests/test_native_ui.py"
      - "connector/tests/test_native_ui_qt.py"
      - "docs/EVENT-ENGINE.md"
      - ".github/workflows/event-engine.yml"
  push:
    branches:
      - "feature/nozza-event-engine-v1"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile Event Engine
        run: python -m compileall -q agent/event_engine.py agent/server.py agent/native_ui
      - name: Event Engine contracts
        run: >-
          python -m unittest
          connector.tests.test_event_engine
          connector.tests.test_autonomy
          connector.tests.test_task_engine
          connector.tests.test_native_ui

  windows-ui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PySide6
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Event Engine UI smoke
        run: python -m unittest connector.tests.test_native_ui_qt
