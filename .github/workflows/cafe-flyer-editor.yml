name: cafe-flyer-editor

on:
  pull_request:
    paths:
      - "site/materials/флаер-кофейням.html"
      - "site/index.html"
      - "connector/tests/test_cafe_flyer.py"
      - ".github/workflows/cafe-flyer-editor.yml"
  push:
    branches:
      - "feature/cafe-flyer-editor-v2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cafe flyer contracts
        run: python -m unittest connector.tests.test_cafe_flyer
      - name: Extract inline editor JavaScript
        shell: python
        run: |
          import pathlib, re
          page = pathlib.Path("site/materials/флаер-кофейням.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", page, re.S)
          if not blocks:
              raise SystemExit("inline script not found")
          pathlib.Path("/tmp/cafe-flyer.js").write_text(blocks[-1], encoding="utf-8")
      - name: JavaScript syntax
        run: node --check /tmp/cafe-flyer.js
