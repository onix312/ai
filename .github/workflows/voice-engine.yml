name: voice-engine

on:
  pull_request:
    paths:
      - "agent/voice_runtime.py"
      - "agent/speech.py"
      - "agent/server.py"
      - "agent/config.py"
      - "agent/pc.py"
      - "agent/tts_quality.py"
      - "agent/tts_service.py"
      - "agent/native_ui/**"
      - "connector/tests/test_voice_runtime.py"
      - "connector/tests/test_tts_quality.py"
      - "connector/tests/test_tts_service.py"
      - "connector/tests/test_luma_config.py"
      - ".github/workflows/voice-engine.yml"
  push:
    branches:
      - "feature/nozza-voice-engine-v2"
    paths:
      - "agent/voice_runtime.py"
      - "agent/speech.py"
      - "agent/server.py"
      - "agent/config.py"
      - "agent/pc.py"
      - "agent/tts_quality.py"
      - "agent/native_ui/**"
      - "connector/tests/test_voice_runtime.py"
      - "connector/tests/test_tts_quality.py"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile voice engine
        run: python -m compileall -q agent/voice_runtime.py agent/speech.py agent/server.py agent/config.py agent/pc.py agent/tts_quality.py agent/tts_service.py agent/native_ui
      - name: Voice state machine tests
        run: python -m unittest connector.tests.test_voice_runtime connector.tests.test_tts_quality connector.tests.test_tts_service connector.tests.test_luma_config connector.tests.test_agent_os.SpeechRuntimeTests connector.tests.test_native_ui

  windows-native:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PySide6
        run: python -m pip install "PySide6>=6.7,<7"
      - name: Native voice UI smoke
        run: python -m unittest connector.tests.test_native_ui_qt
